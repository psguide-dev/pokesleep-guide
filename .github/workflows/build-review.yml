name: Build and publish PokéSleep Guide

on:
  push:
    branches: [main]
    paths:
      - 'master/**'
      - 'templates/**'
      - 'styles/**'
      - 'vendor/enigma-swap/**'
      - 'PSG_face_sheet.js'
      - 'PSG_build_master.py'
      - 'PSG_retired_images.py'
      - 'PSG_trim_assets.py'
      - 'PSG_biblo_assets.py'
      - 'data-import/retired-pokemon-images-v352.json'
      - 'data-import/picasso-sleep-v277/**'
      - 'PSG_import_cooking.py'
      - 'PSG_import_recipe_evaluation.py'
      - 'PSG_import_daily_supply.py'
      - 'PSG_source_template.html'
      - 'PSG_styles.css'
      - 'PSG_specialty_images.js'
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/build-review.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build review from master folders
        run: python3 PSG_build_master.py
      - name: Check image-first species and received artwork
        run: |
          node tests/check_image_first.cjs
          node tests/check_biblo_assets.cjs
          node tests/check_retired_images.cjs
          python tests/check_image_archives.py
      - name: Assemble site, keeping the current main page
        run: |
          mkdir -p public
          cp index.html review.html public/
          if [ -d assets ]; then cp -R assets public/; fi
          cp -R master public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
