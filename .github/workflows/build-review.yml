name: Build and publish PokéSleep Guide

on:
  push:
    branches: [main]
    paths:
      - 'master/**'
      - 'templates/**'
      - 'styles/**'
      - 'vendor/enigma-swap/**'
      - 'vendor/enigma-special/**'
      - 'vendor/enigma-standard/**'
      - 'PSG_face_sheet.js'
      - 'PSG_build_master.py'
      - 'PSG_food_rank_assets.py'
      - 'PSG_special_rank_assets.py'
      - 'research/special4-rank/data/**'
      - 'research/food-rank-v2/data/**'
      - 'PSG_build_sources.py'
      - 'PSG_received_art.py'
      - 'data-import/received-v506/**'
      - 'data-import/reference-v544/**'
      - 'data-import/reference-v548/**'
      - 'data-import/retired-ui-images-v545.json'
      - 'PSG_biblo_assets.py'
      - 'PSG_retired_images.py'
      - 'PSG_trim_assets.py'
      - 'data-import/retired-pokemon-images-v352.json'
      - 'data-import/picasso-sleep-v277/**'
      - 'PSG_import_cooking.py'
      - 'PSG_import_recipe_evaluation.py'
      - 'PSG_import_daily_supply.py'
      - 'PSG_source_template.html'
      - 'PSG_styles.css'
      - 'PSG_specialty_images.js'
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/build-review.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build review from master folders
        run: python3 PSG_build_master.py
      - name: Check generated species field data validation
        run: python3 tests/check_species_fields.py
      - name: Check saved teams and daily forecasts
        run: |
          node tests/check_saved_teams.cjs
          node tests/check_box_update_paths.cjs
          node tests/check_box_evolution_preview.cjs
          node tests/check_filter_menu_dismissal.cjs
          node tests/check_dex_filter_reuse.cjs
          node tests/check_sleep_image_import.cjs
          node tests/check_box_stat_popover.cjs
          node tests/check_image_import.cjs
          node tests/check_species_image_reader.cjs
          node tests/check_ingredient_image_reader.cjs
          node tests/check_ingredient_import.cjs
          node tests/check_fragment_assembly.cjs
          node tests/check_rankings.cjs
          node tests/check_home_calendar.cjs
          node tests/check_detail_routing.cjs
          node tests/check_field_page_split.cjs
          node tests/check_size_references.cjs
          node tests/check_cooking_packages.cjs
          node tests/check_food_environment.cjs
          node tests/check_food_composition.cjs
          node tests/check_special_count.cjs
          node tests/check_special_rank.cjs
          python tests/check_special_rank_assets.py
          node tests/check_food_rank.cjs
          python tests/check_food_rank_assets.py
          node tests/check_daily_audit.cjs
          node tests/check_recipe_team_time.cjs
          node tests/check_recipe_swap_connection.cjs
          node tests/check_same_skill.cjs
          node tests/check_daily_calculator.cjs
          node tests/check_camp_settings.cjs
          node tests/check_camp_evaluation.cjs
          node tests/check_berry_picker.cjs
          node tests/check_field_detail.cjs
          node tests/check_field_ranks.cjs
          node tests/check_ex_daily.cjs
          node tests/check_special_skills.cjs
          node tests/check_energy_feedback.cjs
          node tests/check_pot_feedback.cjs
          node tests/check_skill_summary.cjs
          node tests/check_swap_comparison.cjs
          node tests/check_swap_timeline.cjs
          node tests/check_number_policy.cjs
          node tests/check_evolution_skill_policy.cjs
          node tests/check_evolution_forms_render.cjs
          node tests/check_whistle.cjs
          node tests/check_individual_evaluation.cjs
          node tests/check_individual_trial.cjs
          node tests/check_individual_lazy.cjs
          node tests/check_evaluation_page.cjs
          node tests/check_final_evolution_evaluation.cjs
          node tests/check_food_role.cjs
          node tests/check_food_expansion.cjs
          node tests/check_food_recovery.cjs
          node tests/check_carry_fill.cjs
          node tests/check_berry_role_ui.cjs
          node tests/check_berry_model_interaction.cjs
          node tests/check_berry_all.cjs
          node tests/check_berry_all_loading.cjs
          node tests/check_berry_total.cjs
          node tests/check_berry_total_interaction.cjs
          node tests/check_skill_model.cjs
          node tests/check_skill_model_interaction.cjs
          node tests/check_box_header_spacing.cjs
      - name: Check image-first species and received artwork
        run: |
          node tests/check_reference_lists.cjs
          node tests/check_image_first.cjs
          node tests/check_sleep_moons.cjs
          node tests/check_biblo_assets.cjs
          node tests/check_retired_images.cjs
          python tests/check_image_archives.py
      - name: Assemble site, keeping the current main page
        run: |
          mkdir -p public
          cp index.html review.html pokemon.html public/
          cp evaluation.html public/
          cp fields.html public/
          cp recipes.html ingredients.html public/
          cp -R packages public/
          cp -R data public/
          if [ -d assets ]; then cp -R assets public/; fi
          cp -R master public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
