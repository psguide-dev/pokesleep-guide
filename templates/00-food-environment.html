<script id="psg-food-environment-model">
 // Recipe coverage is independent of supply, recipe quantity and individual strength.
 window.PS_FOOD_ENVIRONMENT=(()=>{
  const categories=Object.freeze(['カレー・シチュー','サラダ','デザート・ドリンク']);
  const potSize=recipe=>Array.isArray(recipe.ingredients)&&recipe.ingredients.length&&recipe.ingredients.every(i=>typeof i.name==='string'&&Number.isFinite(i.qty)&&i.qty>0)?recipe.ingredients.reduce((sum,i)=>sum+i.qty,0):null;
  function build(recipeRows,names,condition){
   const capacity=condition?.capacity,validCapacity=Number.isInteger(capacity)&&capacity>0;
   const eligible=recipeRows.filter(r=>{const size=potSize(r);return validCapacity&&size!==null&&size<=capacity&&r.energy?.max?.level===70&&Number.isFinite(r.energy.max.value)&&r.energy.max.value>0});
   const top=Object.fromEntries(categories.map(category=>[category,eligible.filter(r=>r.category===category).sort((a,b)=>b.energy.max.value-a.energy.max.value||a.id.localeCompare(b.id)).slice(0,5)]));
   const ingredients=Object.fromEntries(names.map(name=>[name,Object.fromEntries(categories.map(category=>{
    const selected=top[category],matches=selected.flatMap((r,index)=>{
     const quantity=r.ingredients.filter(i=>i.name===name).reduce((sum,i)=>sum+i.qty,0);
     return quantity?[{id:r.id,name:r.name,rank:index+1,quantity,energy:r.energy.max.value,energyStatus:r.energy.max.status||'未確認',pot:potSize(r)}]:[];
    });
    return [category,{count:matches.length,total:selected.length,coverage:selected.length?100*matches.length/selected.length:null,meanQuantity:selected.length?matches.reduce((sum,r)=>sum+r.quantity,0)/selected.length:null,matches}];
   }))]));
   return {version:2,metric:'top5_recipe_coverage',recipeLevel:70,condition:{...condition,capacity:validCapacity?capacity:null},categories,top,ingredients};
  }
  function composition(environment,slots){
   if(!Array.isArray(slots)||!slots.length||slots.some(i=>!environment.ingredients[i.name]||!Number.isFinite(i.qty)||i.qty<=0))return null;
   // Call with unlocked A/B/C slots only; duplicate food slots retain their quantities.
   const total=slots.reduce((sum,i)=>sum+i.qty,0);if(!Number.isFinite(total))return null;
   return Object.fromEntries(categories.map(category=>[category,slots.some(i=>environment.ingredients[i.name][category].coverage===null)?null:slots.reduce((sum,i)=>sum+i.qty/total*environment.ingredients[i.name][category].coverage,0)]));
  }
  const cache=new WeakMap();
  function current(catalog,goodCamp,calculatePotCapacity){
   const capacities=(catalog.cooking?.pot?.['拡張表']||[]).map(row=>row['容量']).filter(n=>Number.isInteger(n)&&n>0);
   const baseCapacity=capacities.length?Math.max(...capacities):null,capacity=calculatePotCapacity(baseCapacity,1,0,false,goodCamp);
   const key=JSON.stringify([goodCamp,baseCapacity,capacity]);
   if(!cache.has(catalog))cache.set(catalog,new Map());const conditions=cache.get(catalog);
   if(!conditions.has(key))conditions.set(key,build(Object.values(catalog.recipes||{}),Object.keys(catalog.ingredientAssets||{}),{goodCamp,baseCapacity,capacity}));
   return conditions.get(key);
  }
  return Object.freeze({build,composition,current});
 })();
</script>
