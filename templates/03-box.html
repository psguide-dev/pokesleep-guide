<section id="box" class="screen"><div class="psg-list-sticky"><div class="toolbar psg-screen-toolbar"><h2 class="psg-screen-title">ボックス</h2><input id="boxSearch" placeholder="名前検索" aria-label="ポケモンの名前検索"><button class="btn primary" id="addBtn" aria-expanded="false" aria-controls="boxAddPanel">＋追加</button></div>
<div class="compact-filter" id="boxCompactFilters">
 <div class="box-filter-row">
  <div class="filter-select" data-menu="box-type"><button class="filter-main">タイプ <span>▼</span></button><div class="filter-panel" id="boxTypeFilters"><button class="filter-option" disabled>データ投入後に生成</button></div></div>
  <div class="filter-select" data-menu="box-ing"><button class="filter-main">食材 <span>▼</span></button><div class="filter-panel" id="boxIngredientFilters"><button class="filter-option" disabled>データ投入後に生成</button></div></div>
 </div>
 <div class="box-filter-row">
  <div class="filter-select" data-menu="box-spec"><button class="filter-main">得意 <span>▼</span></button><div class="filter-panel" id="boxSpecialtyFilters"><button class="filter-option" data-spec="きのみ"><img class="psg-specialty-icon" data-specialty-icon="berry" alt="">きのみ</button><button class="filter-option" data-spec="食材"><img class="psg-specialty-icon" data-specialty-icon="ingredient" alt="">食材</button><button class="filter-option" data-spec="スキル"><img class="psg-specialty-icon" data-specialty-icon="skill" alt="">スキル</button><button class="filter-option" data-spec="オール"><img class="psg-specialty-icon" data-specialty-icon="all" alt="">オール</button></div></div>
  <div class="filter-select" data-menu="box-tag"><button class="filter-main">タグ <span>▼</span></button><div class="filter-panel" id="boxTagFilters">
   <button class="filter-option" data-tag="favorite"><img class="psg-ui-icon psg-ui-ui" src="assets/ui/favorite_on.svg" alt=""> お気に入り</button>
   <button class="filter-option" data-tag="training"><img class="psg-ui-icon psg-ui-ui" src="assets/ui/training_on.webp" alt=""> 育成</button>
   <button class="filter-option" data-tag="special">特別</button>
   <button class="filter-option" data-tag="shiny">🌈 色違い</button>
   <div class="tag-note">お気に入り・育成＝ユーザー設定<br>特別＝種族属性／色違い＝個体固有属性</div>
  </div></div>
 </div>
</div><div id="boxSelectedFilters" class="psg-selected-filters" aria-label="選択中の絞り込み条件" hidden></div></div>
<div id="boxAddPanel" class="card" hidden style="margin-bottom:12px"><label for="boxSpecies">図鑑から選ぶ</label><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px"><select id="boxSpecies" class="btn" style="flex:1;min-width:160px"></select><button class="btn primary" id="boxConfirmAdd">Boxに登録</button><button class="btn" id="boxCancelAdd">キャンセル</button></div></div>
<div id="boxUndoPanel" class="card" hidden style="margin-bottom:12px">削除しました。 <button class="btn" id="boxUndoRemove">元に戻す</button></div>
<div id="boxTeamMode" class="psg-box-team-mode" hidden><strong id="boxTeamModeTitle">チームの枠を選択中</strong><span>個体カードをタップして登録</span><button type="button" id="boxTeamRemove">この枠から外す</button><button type="button" id="boxTeamCancel">キャンセル</button></div>
<div id="boxGrid" class="grid"></div><div id="boxEmpty" class="card empty">Boxは空です。「＋追加」から登録できます。</div></section>
