 let ready=false;
 window.PS_PAGE_RENDERERS.expPage=()=>{
  if(ready)return;
  const catalog=window.PS_CATALOG,host=document.getElementById('expContent');

  function section(title){const details=document.createElement('details');details.className='psg-exp-section';const summary=document.createElement('summary');summary.textContent=title;details.append(summary);host.append(details);return details;}
  function note(parent,text){const p=document.createElement('p');p.className='note';p.textContent=text;parent.append(p);}
  function source(){}
  function table(parent,columns,rows){
   const wrap=document.createElement('div');wrap.className='psg-cooking-table-wrap';const element=document.createElement('table');element.className='psg-cooking-table';
   const head=document.createElement('thead'),tr=document.createElement('tr');for(const name of columns){const th=document.createElement('th');th.scope='col';th.textContent=name;tr.append(th)}head.append(tr);element.append(head);
   const body=document.createElement('tbody');element.append(body);wrap.append(element);parent.append(wrap);
   const update=values=>{body.replaceChildren();for(const row of values){const tr=document.createElement('tr');for(const value of row){const td=document.createElement('td');td.textContent=value==null?'未確認':typeof value==='number'?value.toLocaleString('ja-JP'):value;tr.append(td)}body.append(tr)}};
   update(rows);return update;
  }
  const data=catalog.growth,pokemon=section('ポケモンの経験値・ゆめのかけら');
  const label=document.createElement('label');label.textContent='必要EXPタイプ ';
  const select=document.createElement('select');select.setAttribute('aria-label','必要EXPタイプ');
  for(const [type,multiplier]of Object.entries(data.expTypeMultipliers)){const option=document.createElement('option');option.value=type;option.textContent=`${type}（通常の${multiplier}倍）`;select.append(option)}label.append(select);pokemon.append(label);
  note(pokemon,'通常アメ・性格無補正。かけらはアメ1個に必要な費用。育成の合計費用はボックスの個体詳細で確認できます。');
  const update=table(pokemon,['Lv','次LvまでのEXP','次Lvの累計EXP','アメ1個のEXP','アメ1個のかけら'],[]);
  const render=()=>update(data.rows.filter(r=>r.target_level<=data.levelCap).map(row=>{
   const conflict=data.sourceTableConflicts?.some(c=>String(c.exp_type)===select.value&&c.target_level===row.target_level);
   const exp=row.exp_types?.[select.value]?.exp_to_next;
   return [`${row.current_level} → ${row.target_level}`,conflict&&exp!=null?`${exp.toLocaleString('ja-JP')} ※`:exp,row.exp_types?.[select.value]?.cumulative_exp_at_target,row.candy_exp?.neutral,row.dream_shards_per_candy_at_current_level];
  }));select.onchange=render;render();
  note(pokemon,'※ 資料の表と累計丸めによる値に差があります。現在は登録済みの累計丸め値を表示しています。');source(pokemon,data.sources?.level);source(pokemon,data.sources?.exp_type);
  const user=section('ユーザーの経験値（リサーチEXP）'),ranks=catalog.researchRanks;
  if(ranks){table(user,['ランク','必要EXP','累計EXP'],ranks.rows.map(r=>[r.rank,r.expToReach,r.cumulativeExp]));note(user,`ランク到達に必要なEXP。攻略・検証資料の参考値（確認日 ${ranks.checkedAt}）。`);source(user,ranks.source)}else note(user,'リサーチEXP資料は未登録です。');

  if(potData){table(pot,['容量','寝顔種類','拡張のかけら','累計かけら'],potData['拡張表'].map(r=>[r['容量'],r['必要寝顔種類数'],r['拡張1回のゆめのかけら'],r['初期からの累計ゆめのかけら']]));note(pot,`通常鍋の容量。資料確認日 ${potData['確認日']}。`);for(const url of potData['出典']||[])source(pot,url)}else note(pot,'鍋の拡張費用は未登録です。');
  ready=true;
 };

 window.PS_PAGE_RENDERERS.sourcesPage=()=>{
  const host=document.getElementById('sourcesContent');host.replaceChildren();
  const groups=new Map();
  function add(category,url,title){
   if(typeof url!=='string'||!/^https?:\/\//.test(url)||/\.(png|webp|jpg|jpeg|gif|svg)(\?|$)/i.test(url))return;
   const entries=groups.get(category)||new Map();if(!entries.has(url))entries.set(url,title||url);groups.set(category,entries);
  }
  function scan(value,category,key=''){
   if(typeof value==='string'){if(/source|出典|url|reference/i.test(key))add(category,value);return;}
   if(!value||typeof value!=='object')return;
   if(value.url)add(category,value.url,value.title||value.name);
   if(Array.isArray(value)){value.forEach(v=>scan(v,category,key));return;}
   for(const [k,v] of Object.entries(value))if(!/image|icon|asset|visual/i.test(k))scan(v,category,/source|出典|reference/i.test(key)?key:k);
  }
  const labels={pokemon:'ポケモン',forms:'姿違い',sleepStyles:'寝顔',fields:'フィールド・EX',skills:'スキル',ingredients:'食材',recipes:'料理',cooking:'料理・鍋',growth:'育成・経験値',researchRanks:'リサーチ',recipeEvaluation:'料理評価',dailySupply:'食材予想'};
  for(const [key,value] of Object.entries(window.PS_CATALOG))scan(value,labels[key]||'計算・補助情報');
  scan(window.PS_GAME_EVENTS,'ゲームの予定');
  scan(window.PS_BERRY_RANKINGS,'きのみ効率ランキング');scan(window.PS_TRIAL_RANKINGS,'試作ランキング');
  const staticSources=[{"url": "https://www.pokemongoplusplus.com/sleep/", "title": "公式説明", "category": "計算・補助情報"}, {"url": "https://www.fireyoshida.com/entry/2023/10/20/133854", "title": "能力表の参照資料", "category": "計算・補助情報"}, {"url": "https://wikiwiki.jp/poke_sleep/メインスキル/食材セレクト", "title": "食材セレクトの仕様参照", "category": "計算・補助情報"}, {"url": "https://namakemono289.hatenablog.com/entry/2025/12/23/011054", "title": "ホイッスルの効果検証", "category": "計算・補助情報"}];
  staticSources.forEach(s=>add(s.category,s.url,s.title));

(()=>{
const data=window.PS_TRIAL_RANKINGS,fmt=n=>window.PS_NUMBERS.display(n);
function text(host,value,tag='p'){const node=document.createElement(tag);node.textContent=value;host.append(node);return node}
function group(host,title){const d=document.createElement('details');d.className='psg-bookshelf-section';text(d,title,'summary');host.append(d);return d}
function table(host,labels,rows){const wrap=document.createElement('div');wrap.className='psg-cooking-table-wrap';const t=document.createElement('table');t.className='psg-cooking-table';const head=document.createElement('thead'),tr=document.createElement('tr');for(const label of labels){const th=text(tr,label,'th');th.scope='col'}head.append(tr);t.append(head);const body=document.createElement('tbody');for(const values of rows){const row=document.createElement('tr');for(const value of values)text(row,String(value),'td');body.append(row)}t.append(body);wrap.append(t);host.append(wrap)}
function conditions(host,food=false){text(host,'試作：Lv60・性格無補正・サブスキルなし・FB0％。げんき100開始、4時間ごとに回収、活動16時間＋睡眠8時間、起床時／6h／12hに食事。キャンチケ・リボン・イベントなし。スキルは種類ごとの上限Lv。進化による所持数＋5は別加算しません。');const detail=group(host,'比較条件・推定・未加算');text(detail,food?'通常はスキルOFF。スキル込みは本人の通常収集＋スキルによる全員の生成＋仲間の通常収集増減。仲間はライチュウ4体AAA・スキル停止。食材ごとに最良構成が異なり、同じ個体で全食材の最良値を同時に出せるとは限りません。':'本人の通常きのみ＋直接スキルエナジー／全員の生成きのみ＋仲間の通常きのみ増減。仲間4体の元々の産出は含めません。タイプ・共通参考はライチュウ4体、仲間のスキル停止、好物補正なし。島別は通常の好物2倍。料理・食材・鍋・かけら・アメはエナジー換算しません。');text(detail,'2026/10/07の試算・248姿。タマゲタケは試算対象外、ミュウは入力不足で除外。モロバレルは基礎所持14・食材20.4%・スキル4.7%の試作入力（現行のスキル確率は未登録）。固定げんきのきのみ効率とは別条件です。総合ティアではありません。');for(const note of (food?data.food:data.energy).limitations)if(!/タマゲタケ|モロバレル/.test(note))text(detail,note);text(detail,'未加算はゲーム上の効果が0という意味ではありません。出典は情報の出典ページに集約しています。');}
function energyTable(host,rows){table(host,['順位','ポケモン','エナジー／時（1日÷24）','本人きのみ／日','スキル／日','仲間増減／日'],rows.map(x=>[x.rank,x.name,fmt(x.energyPerHour),fmt(x.ownBerryPerDay),fmt(x.skillEnergyPerDay),fmt(x.teammateProductionDeltaPerDay)]))}
window.PS_PAGE_RENDERERS.skillEnergyRankingPage=()=>{const host=document.getElementById('skillEnergyRankingContent');host.replaceChildren();conditions(host);energyTable(group(host,'共通条件の参考 上位10体'),data.energy.overallTop);for(const g of data.energy.types)energyTable(group(host,g.type+' 上位5体'),g.entries)};
window.PS_RENDER_FIELD_TRIAL=id=>{const host=document.getElementById('fieldRankingContent');const g=data.energy.islands.find(g=>g.id===id);if(!g)return;const d=group(host,'スキル込みエナジー 上位10体（試作）');conditions(d);text(d,'参照する仲間：'+g.references.map(x=>x.name).join('、')+'。島ごとに編成が異なるため島間は同条件ではありません。');energyTable(d,g.entries)};
window.PS_PAGE_RENDERERS.ingredientRankingPage=()=>{const host=document.getElementById('ingredientRankingContent');host.replaceChildren();conditions(host,true);const label=text(host,'比較方法：','label'),select=document.createElement('select');select.setAttribute('aria-label','食材順位の比較方法');for(const [value,title] of [['normalTop5','通常収集（スキルOFF）'],['skillTop5','スキル込み食材貢献'],['foodSpecialtyTop5','食材得意限定（スキルOFF）']]){const o=text(select,title,'option');o.value=value}select.value='normalTop5';label.append(select);const results=document.createElement('div');host.append(results);function render(){results.replaceChildren();for(const g of data.food.groups){const d=group(results,g.ingredient+' 上位5体');table(d,['順位','ポケモン','構成 Lv1／30／60','個／日',...(select.value==='skillTop5'?['本人通常／日','スキル生成／日','仲間増減／日']:[])],g[select.value].map(x=>[x.rank,x.name,[1,30,60].map(l=>x.selection[l]).join('／'),fmt(select.value==='skillTop5'?x.contributionPerDay:x.baselinePerDay),...(select.value==='skillTop5'?[fmt(x.ownNormalPerDay),fmt(x.generatedBySkillPerDay),fmt(x.teammateNormalDeltaPerDay)]:[])]))}}select.onchange=render;render()};
})();
</script>
