<section id="boxDetail" class="screen">
 <div class="detail-head"><button class="btn" data-back>‹ 戻る</button><h2><small id="boxHeaderNo"></small><span id="boxTitle">個体詳細</span></h2><details id="boxHeaderMenu" class="psg-box-header-menu"><summary class="btn" id="boxHeaderEdit">サブメニュー</summary><div class="psg-box-header-menu-items"><button class="btn" type="button" id="boxEditShortcut">個体値設定</button><button class="btn" type="button" id="boxRemoveBtn">削除</button></div></details></div>
 <div class="psg-box-hero card">
  <div class="psg-box-identity"><div class="psg-v106-media"><div id="boxArtwork" class="psg-box-artwork" aria-label="ポケモンの画像"></div></div>
   <div class="psg-detail-facts"><div id="boxTraits" class="psg-detail-traits">
    <div id="boxBerry" class="psg-detail-trait psg-detail-berry"></div>
    <div id="boxSleep" class="psg-detail-trait"></div>
    <div class="psg-box-flags psg-fact-toggle"><button class="btn" type="button" id="boxFavorite" aria-pressed="false" aria-label="お気に入り" title="お気に入り">☆</button></div>
    <div class="psg-box-flags psg-fact-toggle"><button class="btn" type="button" id="boxTraining" aria-pressed="false" aria-label="育成対象" title="育成対象">🌱</button></div>
    <div id="boxSpecialty" class="psg-detail-trait psg-detail-specialty"></div>
    <div id="boxRibbon" class="psg-detail-trait psg-detail-ribbon"></div>
    <div id="boxSpeed" class="psg-fact-speed"></div>
   </div><div id="boxStats" class="psg-detail-stats"></div></div></div>
  <div class="psg-box-level"><div class="psg-box-level-controls"><button class="btn" id="minus" aria-label="レベルを１下げる">−</button><b id="lv">Lv.1</b><button class="btn" id="plus" aria-label="レベルを１上げる">＋</button></div><input id="lvRange" type="range" min="1" max="70" value="1" aria-label="レベルを選択"></div>
 </div>
 <section class="psg-box-section psg-box-food-section card" aria-label="食材"><div class="psg-box-food-heading"><div id="boxIngredientRows"></div></div><div id="boxDayFood" class="psg-box-day-food" aria-live="polite"></div></section>
 <section class="psg-box-section card" aria-label="サブスキル"><div id="boxSubskillRows"></div></section>
 <section class="psg-box-section card" aria-label="メインスキル"><div id="boxMainSkill"></div></section>
 <section class="psg-box-section psg-box-evaluation-section card"><h3 class="psg-evaluation-heading"><span>個体の評価</span><small id="boxEvaluationRole"></small></h3><div id="boxEvaluation"></div></section>
 <section class="psg-box-section card"><h3>育成・進化</h3><div id="boxGrowth"></div></section>
 <details class="psg-box-editor card" id="boxEditor"><summary>⚙️ 個体を編集</summary>
   <form id="boxEditForm"><label id="boxAppearanceLabel" hidden><span id="boxAppearanceTitle">衣装・サイズ</span><select name="appearance" id="boxEditAppearance"></select></label><label id="boxEvolutionLabel">進化（現在の姿）<select name="evolution" id="boxEditEvolution"></select></label><p class="psg-box-muted psg-editor-note">個体情報を引き継ぎます。衣装・サイズはゲーム内の現在の姿に合わせてください。進化先を選ぶとスキルLvを上限に設定します。その後、手動で調整できます。</p>
    <div class="psg-editor-ribbon"><label>おやすみリボン<select name="ribbonHours"><option value="0">なし</option><option value="200">200時間</option><option value="500">500時間</option><option value="1000">1000時間</option><option value="2000">2000時間</option></select></label><span id="boxRibbonPreview" class="psg-ribbon-preview" aria-label="選択したリボン"></span></div>
    <div id="boxEditIngredients"></div>
    <div id="boxEditSubskills"></div>
    <div class="psg-editor-skill-role"><label>スキルLv<select name="skillLevel"></select></label><label>役割<select name="role"><option value="">未設定</option><option value="きのみ">きのみ</option><option value="食材">食材</option><option value="スキル">スキル</option></select></label></div>
    <div class="psg-editor-nature-heading"><p id="boxNatureInferred" class="psg-box-muted" aria-live="polite"></p><label class="psg-editor-check"><input name="mint" type="checkbox"><span id="boxMintIcon"></span>まっしろミント</label></div>
    <div class="psg-editor-nature-axes"><label>上昇項目<select id="boxNatureUp" aria-label="性格の上昇項目"></select></label><label>下降項目<select id="boxNatureDown" aria-label="性格の下降項目"></select></label></div><label id="boxNeutralNatureLabel">無補正の性格<select name="nature" id="boxEditNature"></select></label>
    <div id="boxEditMythical" hidden></div>
    <button type="submit" class="btn primary">個体データを保存</button><p id="boxEditMessage" role="status"></p>
   </form>
 </details>
</section>
