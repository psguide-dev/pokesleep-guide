<script id="psg-sleep-image-controller">
(()=>{
 const $=id=>document.getElementById(id),dialog=$('sleepImageDialog'),files=$('sleepImageFiles'),read=$('sleepImageRead'),form=$('sleepImageForm'),status=$('sleepImageStatus');
 let epoch=0,worker=null,busy=false,timer=null,urls=[],resultRows=[],countRows=[];
 function setBusy(value){busy=value;files.disabled=value;read.disabled=value||!files.files.length;$('sleepImageStop').hidden=!value;$('sleepImageSave').disabled=value}
 function stop(message='読み取りを中止しました。'){epoch++;clearTimeout(timer);timer=null;const old=worker;worker=null;if(old)old.terminate().catch(()=>{});setBusy(false);status.textContent=message}
 function clear(){dialog.classList.remove('is-review');urls.forEach(url=>URL.revokeObjectURL(url));urls=[];$('sleepImagePreviews').replaceChildren();$('sleepImageResults').replaceChildren();resultRows=[];countRows=[];countRows=[];form.hidden=true;$('sleepImageMessage').textContent=''}
 function options(select,rows,empty){select.replaceChildren();const blank=document.createElement('option');blank.value='';blank.textContent=empty;select.append(blank);for(const row of rows){const option=document.createElement('option');option.value=row.value;option.textContent=row.label;select.append(option)}}
 function overviewCards(groups,entries,speciesRows,found){
  const grid=document.createElement('div');grid.className='psg-sleep-overview-grid';
  const cards=groups.flatMap(group=>group.aggregateStyles?.length&&group.count===group.total?
   [...new Set(group.aggregateStyles.map(r=>r.speciesId))].map(id=>({...group,aggregateStyles:[],speciesId:id,styleIds:group.aggregateStyles.filter(r=>r.speciesId===id).map(r=>r.id),variant:true})): [group]);
  for(const group of cards){
   const card=document.createElement('section');card.className='psg-sleep-overview-card';
   const species=document.createElement('select');species.setAttribute('aria-label',`No.${group.no}のポケモン（姿・衣装も確認）`);
   const sameNo=speciesRows.filter(r=>group.candidates.some(e=>e.speciesId===r.value));
   const allChoice=group.aggregateStyles?.length?[{value:'__all__',label:`${sameNo.find(r=>r.value.endsWith('_default'))?.label||'No.'+group.no}（姿・衣装合計）`}]:[];
   options(species,[...allChoice,...sameNo.map(r=>({...r,label:sameNo.length>1&&r.value.endsWith('_default')?`${r.label}（通常）`:r.label}))],`No.${group.no} 姿・衣装を選択`);
   const other=document.createElement('optgroup');other.label='No.の読み取りを修正';
   for(const item of speciesRows.filter(r=>!sameNo.some(e=>e.value===r.value))){const option=document.createElement('option');option.value=item.value;option.textContent=item.label;other.append(option)}species.append(other);
   species.value=allChoice.length?'__all__':group.speciesId||'';card.append(species);
   const name=document.createElement('div');name.className='psg-sleep-overview-name';card.prepend(name);
   const updateName=()=>{
    const full=species.selectedOptions[0]?.textContent||`No.${group.no}`;name.title=full;
    const label=full.replace(/[（(]([^）)]*)[）)]/g,(whole,content)=>{
     const short=content.includes('キャプテン')?'CP':content.includes('ハロウィン')?'HW':content.includes('ホリデー')?'HD':content==='姿・衣装合計'?'合計':content;
     return `(${short})`;
    });
    name.replaceChildren();const parts=label.split(/(?=[（(])/);
    for(const [i,part] of parts.entries()){if(i)name.append(document.createElement('br'));const line=document.createElement('span');line.className=i?'psg-sleep-overview-form':'psg-sleep-overview-species';line.textContent=part;name.append(line)}
   };
   species.title='ポケモン・姿を変更';
   const note=document.createElement('small');card.append(note);
   const stars=document.createElement('div');stars.className='psg-sleep-overview-stars';card.append(stars);
   const countOnly=group.aggregateStyles?.length&&group.count!==group.total;
   if(countOnly){card.classList.add('is-count-only');
    const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=true;
    label.className='psg-sleep-count-check';label.append(check,document.createTextNode('数を登録'));stars.append(label);
    const hint=document.createElement('small');hint.textContent='内訳は未設定';stars.append(hint);
    species.disabled=true;countRows.push({check,group});note.textContent=`No.${group.no} · ${group.count}/${group.total}`;updateName();species.onchange=updateName;grid.append(card);continue;
   }
   const fill=(initial=false)=>{updateName();
    resultRows=resultRows.filter(r=>r.group!==card);stars.replaceChildren();
    const aggregate=species.value==='__all__';stars.className='psg-sleep-overview-stars'+(aggregate?' is-aggregate':'');
    const styles=aggregate?group.aggregateStyles:entries.filter(r=>r.speciesId===species.value).sort((a,b)=>Number(a.stars)-Number(b.stars));
    const selectedIds=initial?group.styleIds:aggregate?(group.count===group.total?styles.map(r=>r.id):[]):window.PS_SLEEP_IMAGE_READER.selectedOverviewStyles(group,species.value,entries);
    const subgroups=new Map();
    note.textContent=group.count===null?'数を確認':`No.${group.no} · ${group.variant?styles.length:group.count}/${group.variant?styles.length:group.total}${selectedIds.length?'':'・星を選択'}`;
    for(const style of styles){
     const label=document.createElement('label'),check=document.createElement('input'),text=document.createElement('span');check.type='checkbox';check.checked=selectedIds.includes(style.id);
     check.setAttribute('aria-label',`${style.pokemon} ★${style.stars} ${style.name}を登録`);label.title=`${style.name}${found[style.id]?'（登録済み）':''}`;
     text.textContent=`★${style.stars}`;label.append(text,check);
     let host=stars;
     if(aggregate){
      if(!subgroups.has(style.speciesId)){
       const section=document.createElement('div'),heading=document.createElement('small'),checks=document.createElement('div');checks.className='psg-sleep-overview-stars';
       heading.textContent=style.speciesId.endsWith('_default')?'通常':style.pokemon.includes('ハロウィン')?'ハロウィン（共通）':style.pokemon.match(/[（(](.*)[）)]/)?.[1]||style.pokemon;
       section.append(heading,checks);stars.append(section);subgroups.set(style.speciesId,checks);
      }host=subgroups.get(style.speciesId);
     }
     host.append(label);resultRows.push({check,species:aggregate?{value:style.speciesId}:species,style:{value:style.id},group:card});
    }
   };fill(true);species.onchange=()=>fill();
   if(group.speciesId&&group.count!==null&&group.count<group.total){
    const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=true;label.className='psg-sleep-count-check';label.append(check,document.createTextNode(`${group.count}/${group.total} 数を登録`));card.append(label);countRows.push({check,group});
   }grid.append(card);
  }return grid;
 }
 function review(texts){
  const entries=window.PS_SLEEP_IMAGE_READER.entries();let found={};try{found=JSON.parse(localStorage.getItem('psg-sleep-discoveries-v1')||'{}')||{}}catch{}
  $('sleepImageResults').replaceChildren();resultRows=[];countRows=[];
  const speciesRows=[...new Map(entries.map(r=>[r.speciesId,{value:r.speciesId,label:r.pokemon}])).values()];
  texts.forEach((reading,index)=>{
   const text=typeof reading==='string'?reading:reading.text;
   if(reading.overview?.length){
    const section=document.createElement('section');section.className='psg-sleep-scan-result';
    const title=document.createElement('strong');title.textContent=`画像 ${index+1}・${reading.overview.length}体`;section.append(title,overviewCards(window.PS_SLEEP_IMAGE_READER.groupOverview(reading.overview),entries,speciesRows,found));
    const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent='読み取りテキスト';pre.textContent=text;details.append(summary,pre);section.append(details);$('sleepImageResults').append(section);return;
   }
   const results=window.PS_SLEEP_IMAGE_READER.parseMany(text,entries);
   const section=document.createElement('section');section.className='psg-sleep-scan-result';
   const heading=document.createElement('div');heading.className='psg-sleep-scan-heading';
   const title=document.createElement('strong');title.textContent=`画像 ${index+1}`;
   const species=document.createElement('select');species.setAttribute('aria-label',`画像${index+1}のポケモン（姿・衣装も確認）`);
   options(species,speciesRows,'ポケモンを選択');species.value=results[0]?.speciesId||'';heading.append(title,species);section.append(heading);
   const imageRows=[];
   results.forEach((result,part)=>{
    const row=document.createElement('div');row.className='psg-sleep-scan-row';
    const checkLabel=document.createElement('label');checkLabel.className='psg-image-check';
    const check=document.createElement('input');check.type='checkbox';check.checked=true;check.setAttribute('aria-label',`画像${index+1}の候補${part+1}を登録`);checkLabel.append(check);
    const style=document.createElement('select');style.setAttribute('aria-label',`画像${index+1}の候補${part+1}の寝顔`);
    const fill=()=>{options(style,entries.filter(r=>r.speciesId===species.value).map(r=>({value:r.id,label:`★${r.stars} ${r.name}${found[r.id]?'（登録済み）':''}`})),'寝顔を選択（未判定）');style.disabled=!species.value};fill();style.value=result.styleId||'';
    row.append(checkLabel,style);section.append(row);imageRows.push(fill);resultRows.push({check,species,style});
   });
   species.onchange=()=>imageRows.forEach(fill=>fill());
   const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent='読み取りテキスト';pre.textContent=text||'文字を読み取れませんでした。';details.append(summary,pre);section.append(details);
   $('sleepImageResults').append(section);
  });form.hidden=false;dialog.classList.add('is-review');dialog.scrollLeft=0;

 }
 $('sleepImageOpen').onclick=()=>{stop();clear();files.value='';setBusy(false);status.textContent='初回は読み取りデータを取得します。';dialog.showModal();dialog.scrollLeft=0};
 $('sleepImageClose').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{stop();clear();files.value=''});dialog.addEventListener('cancel',()=>stop());$('sleepImageStop').onclick=()=>stop();
 files.onchange=()=>{
  stop();clear();const selected=[...files.files];
  if(selected.length>5||selected.some(f=>!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>10*1024*1024)){files.value='';status.textContent='PNG・JPEG・WebPを5枚まで、1枚10MB以内で選んでください。';setBusy(false);return}
  for(const file of selected){const url=URL.createObjectURL(file);urls.push(url);const image=document.createElement('img');image.src=url;image.alt=file.name;$('sleepImagePreviews').append(image)}
  status.textContent=selected.length?`${selected.length}枚を選択しました。「読み取る」を押してください。`:'画像を選んでください。';setBusy(false);
 };
 read.onclick=async()=>{
  if(busy||!files.files.length)return;const token=++epoch,selected=[...files.files],texts=[];let ownWorker=null;setBusy(true);form.hidden=true;dialog.classList.remove('is-review');status.textContent='読み取り機能を準備しています…';
  timer=setTimeout(()=>{if(token===epoch)stop('読み取りがタイムアウトしました。枚数を減らして再試行してください。')},180000);
  try{
   const engine=await window.PS_IMAGE_READER.loadEngine();if(token!==epoch)return;
   ownWorker=await engine.createWorker(['jpn'],1,{workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/worker.min.js',corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0',logger:event=>{if(token===epoch&&event.status==='recognizing text')status.textContent=`画像 ${texts.length+1}/${selected.length} 読み取り中 ${Math.round(event.progress*100)}%`}});
   if(token!==epoch)return;worker=ownWorker;await worker.setParameters({tessedit_pageseg_mode:engine.PSM.SPARSE_TEXT,preserve_interword_spaces:'1'});
   for(const file of selected){
    if(token!==epoch)return;const canvas=await window.PS_IMAGE_READER.canvas(file);let right=null;
    try{
     await worker.reinitialize('jpn');if(token!==epoch)return;
     await worker.setParameters({tessedit_pageseg_mode:engine.PSM.SPARSE_TEXT,preserve_interword_spaces:'1'});
     const result=await worker.recognize(canvas);if(token!==epoch)return;
     if(window.PS_SLEEP_IMAGE_READER.isOverview(result.data.text||'')){
      const columns=[];await worker.reinitialize('eng');if(token!==epoch)return;
      await worker.setParameters({tessedit_pageseg_mode:engine.PSM.SPARSE_TEXT,preserve_interword_spaces:'1'});
      for(let column=0;column<4;column++){
       if(token!==epoch)return;const width=canvas.width*.23,height=canvas.height*.735,scale=Math.min(2,Math.sqrt(3000000/(width*height)));
       right=document.createElement('canvas');right.width=Math.round(width*scale);right.height=Math.round(height*scale);
       right.getContext('2d').drawImage(canvas,canvas.width*(.04+.23*column),canvas.height*.145,width,height,0,0,right.width,right.height);
       const extra=await worker.recognize(right);if(token!==epoch)return;columns.push(extra.data.text||'');right.width=right.height=1;right=null;
      }
      const overview=window.PS_SLEEP_IMAGE_READER.parseOverview(columns,window.PS_SLEEP_IMAGE_READER.entries());
      texts.push({text:columns.join('\n'),overview});continue;
     }
     // The detail list keeps its names on the right, separate from the illustrations.
     const width=canvas.width*.50,height=canvas.height*.75,scale=Math.min(1.5,Math.sqrt(3000000/(width*height)));
     right=document.createElement('canvas');right.width=Math.round(width*scale);right.height=Math.round(height*scale);
     right.getContext('2d').drawImage(canvas,canvas.width*.46,canvas.height*.12,width,height,0,0,right.width,right.height);
     const extra=await worker.recognize(right);if(token!==epoch)return;
     texts.push((result.data.text||'')+'\n'+(extra.data.text||''));
    }finally{canvas.width=canvas.height=1;if(right)right.width=right.height=1}
   }
   if(token!==epoch)return;review(texts);status.textContent=`${resultRows.length}件の候補を読み取りました。`;
  }catch(error){if(token===epoch)status.textContent=error?.message||'読み取れませんでした。もう一度お試しください。'}
  finally{if(ownWorker)try{await ownWorker.terminate()}catch{}if(token===epoch){worker=null;clearTimeout(timer);timer=null;setBusy(false)}}
 };
 form.onsubmit=event=>{
  event.preventDefault();if(busy||form.hidden)return;const entries=window.PS_SLEEP_IMAGE_READER.entries(),selected=resultRows.filter(r=>r.check.checked);
  const selectedCounts=countRows.filter(r=>r.check.checked).map(r=>r.group);
  if(!selected.length&&!selectedCounts.length){$('sleepImageMessage').textContent='登録する寝顔を選んでください。';return}
  if(selected.some(r=>!entries.some(e=>e.speciesId===r.species.value&&e.id===r.style.value))){$('sleepImageMessage').textContent='チェックした画像のポケモン・寝顔を確認してください。';return}
  const countKey=window.PS_SLEEP_PROGRESS.key,foundKey='psg-sleep-discoveries-v1';
  let oldFound,oldCounts,written=false;
  try{
   oldFound=localStorage.getItem(foundKey);oldCounts=localStorage.getItem(countKey);
   const ids=[...new Set(selected.map(r=>r.style.value))],saved=JSON.parse(oldFound||'{}'),updated=window.PS_SLEEP_IMAGE_READER.mergeFound(saved,ids,entries);
   const counts=window.PS_SLEEP_PROGRESS.merge(JSON.parse(oldCounts||'{}'),selectedCounts,entries);
   localStorage.setItem('psg-sleep-discoveries-v1',JSON.stringify(updated));written=true;localStorage.setItem(countKey,JSON.stringify(counts));
   window.PS?.renderDex?.();window.dispatchEvent(new Event('psn-sleep-discoveries-changed'));
   $('sleepImageMessage').textContent=`寝顔 ${ids.length}件・達成数 ${selectedCounts.length}体を登録しました。`;
   selected.forEach(r=>r.check.checked=false);countRows.forEach(r=>r.check.checked=false);
  }catch{
   if(written)try{if(oldFound===null)localStorage.removeItem(foundKey);else localStorage.setItem(foundKey,oldFound);if(oldCounts===null)localStorage.removeItem(countKey);else localStorage.setItem(countKey,oldCounts)}catch{}
   $('sleepImageMessage').textContent='保存できませんでした。確認内容はこの画面に残しています。';
  }
 };
})();
</script>
