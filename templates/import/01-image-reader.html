<script id="psg-image-reader">
// Shared, on-device screenshot reader. No images or OCR results are sent to a server.
(()=>{
 const compact=value=>String(value||'').normalize('NFKC').replace(/[\s　]/g,'');
 const unique=values=>[...new Set(values.filter(value=>value!==null&&value!==undefined&&value!==''))];
 function parse(text,{species=[],natures=[],subskills=[],levels=[10,25,50,70,80]}={},regions=[]){
  const lines=String(text||'').split(/\r?\n/).map(compact).filter(Boolean),whole=lines.join('\n');
  const nameLine=line=>line.replace(/^No\.?\d+[:：]?/i,'').replace(/^Lv[.:・]?\d{1,3}/i,'');
  const exactNames=species.filter(p=>lines.some(line=>nameLine(line)===compact(p.name)));
  const speciesIds=unique(exactNames.map(p=>p.speciesId||`${String(p.no).padStart(4,'0')}_default`));
  const natureLines=[...lines,...regions.filter(r=>r.kind==='nature').flatMap(r=>r.text.split(/\r?\n/).map(compact))];
  const natureNames=unique(natures.filter(name=>natureLines.some(line=>line===name||line===`せいかく${name}`||line===`性格${name}`||line===`せいかく:${name}`||line===`性格:${name}`)||regions.some(r=>r.kind==='nature'&&compact(r.text).includes(name))));
  const hits=line=>subskills.filter(name=>line.replace(/[$|]/g,'').includes(compact(name)));
  // Do not confuse ingredient unlocks, subskill unlocks or main-skill levels with Pokémon Lv.
  const firstSection=lines.findIndex(line=>/食材|メインスキル|サブスキル|せいかく|性格/.test(line));
  const header=firstSection<0?lines.slice(0,5):lines.slice(0,firstSection);
  const namedLevels=lines.filter(line=>exactNames.some(p=>nameLine(line)===compact(p.name))).flatMap(line=>{const m=line.match(/^Lv[.:・]?(\d{1,3})/i);return m?[Number(m[1])]:[]});
  const levelValues=namedLevels.length?unique(namedLevels):unique(header.filter(line=>!hits(line).length&&!/スキル|あと|EXP|必要|解放/.test(line)).flatMap(line=>{
   const match=line.match(/(?:^|レベル|ポケモン)L[vV][.:・]?(\d{1,3})(?!\d)/i)||line.match(/^レベル[:：]?(\d{1,3})(?!\d)/);
   return match&&(speciesIds.length||/RP|ポケモン|レベル/.test(whole))?[Number(match[1])]:[];
  }));
  const slots=levels.map(()=>[]),skillValues=[];
  const slotIndex=level=>{const i=levels.indexOf(level);return i>=0?i:level===75?3:level===100?4:-1};
  lines.forEach((line,i)=>{
   const marker=line.match(/L[vV][.:・]?(\d{1,3})(?!\d)/i);
   if(marker){
    const index=slotIndex(Number(marker[1]));
    if(index>=0){
     const nearby=[line];
     for(let offset=1;offset<=2&&i+offset<lines.length;offset++){
      if(/L[vV][.:・]?\d/i.test(lines[i+offset])||/メインスキル|せいかく|性格/.test(lines[i+offset]))break;
      nearby.push(lines[i+offset]);
     }
     const names=unique(nearby.flatMap(hits));if(names.length===1)slots[index].push(names[0]);
    }
   }
   if(/メインスキル/.test(line)){
    const area=lines.slice(i,i+5).join('\n').split('サブスキル')[0];
    for(const m of area.matchAll(/L[vV][.:・]?(\d{1,2})(?!\d)/gi))if(Number(m[1])<=8)skillValues.push(Number(m[1]));
   }
  });
  const skillDirect=whole.match(/(?:スキルLv\.?|スキルレベル[:：]?)(\d{1,2})(?!\d)/i);
  if(skillDirect)skillValues.push(Number(skillDirect[1]));
  // Combined heading has no Lv next to it. The main skill's own name/Lv row does.
  for(const line of lines)if(!hits(line).length&&!/サブスキル/.test(line)&&/L[vV][.:・]?[1-8](?!\d)/i.test(line)){
   const m=line.match(/L[vV][.:・]?([1-8])(?!\d)/i);if(firstSection>=0&&lines.indexOf(line)>firstSection)skillValues.push(Number(m[1]));
  }
  const regionCandidates=[];
  for(const region of regions){
   const value=compact(region.text);let names=unique(hits(value));
   // A single extra/missing kana is accepted only inside one located skill card,
   // with one unique dictionary match and the same S/M/L suffix.
   if(region.kind==='subskill'&&!names.length){
    const oneEdit=(a,b)=>{if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,edits=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++edits>1)return false;if(a.length>=b.length)i++;if(b.length>=a.length)j++}return edits+a.length-i+b.length-j<=1};
    const clean=value.replace(/[$|]/g,'');names=subskills.filter(name=>clean.length>=7&&(/[SML]$/.exec(clean)?.[0]||'')===(/[SML]$/.exec(name)?.[0]||'')&&oneEdit(clean,compact(name)));
   }
   if(region.kind==='subskill'&&Number.isInteger(region.index)&&names.length===1){slots[region.index].push(names[0]);regionCandidates.push(names[0])}
   if(region.kind==='main')for(const m of value.matchAll(/Lv[.:・]?([1-8])(?!\d)/gi))skillValues.push(Number(m[1]));
  }
  const single=values=>unique(values).length===1?unique(values)[0]:null;
  return {speciesId:single(speciesIds),level:single(levelValues),nature:single(natureNames),skillLevel:single(skillValues),
   subskills:slots.map(single),candidates:unique([...lines.flatMap(hits),...regionCandidates]),
   conflicts:[speciesIds.length>1?'ポケモン':null,levelValues.length>1?'レベル':null,natureNames.length>1?'性格':null,...slots.map((v,i)=>unique(v).length>1?`Lv.${levels[i]} サブスキル`:null)].filter(Boolean)};
 }
 // Locate the game's two-column, five-card grid from the colored unlocked cards.
 // Require both columns and a second row: do not guess a grid from an arbitrary crop.
 function regionsFromPixels(pixels,width,height){
  const size=width*height,mask=new Uint8Array(size),queue=new Int32Array(size),green=[];
  for(let y=0;y<height;y++){
   let count=0;for(let x=0;x<width;x++){
    const i=y*width+x,r=pixels[4*i],g=pixels[4*i+1],b=pixels[4*i+2];
    // Locked blue cards are nearly white, but retain a blue/green tint.
    mask[i]=g>180&&r>180&&(b<190||r+10<b&&g>r+5&&b>225)?1:0;
    if(g>150&&g>r*1.25&&g>b*1.2)count++;
   }
   if(count>width*.5)green.push(y);
  }
  const bands=[];for(const y of green){if(bands.length&&y===bands.at(-1).end+1)bands.at(-1).end=y;else bands.push({start:y,end:y})}
  const headers=bands.filter(b=>b.end-b.start>=3),boxes=[];
  for(let start=0;start<size;start++){
   if(mask[start]!==1)continue;let head=0,tail=1;queue[0]=start;mask[start]=2;let minX=width,minY=height,maxX=0,maxY=0;
   while(head<tail){const i=queue[head++],x=i%width,y=Math.floor(i/width);minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);
    for(const next of [x>0?i-1:-1,x<width-1?i+1:-1,y>0?i-width:-1,y<height-1?i+width:-1])if(next>=0&&mask[next]===1){mask[next]=2;queue[tail++]=next}
   }
   const w=maxX-minX+1,h=maxY-minY+1;
   if(w>width*.25&&w<width*.48&&h>height*.015&&h<height*.10&&tail>w*h*.45)boxes.push({x:minX,y:minY,width:w,height:h});
  }
  const sorted=boxes.sort((a,b)=>a.y-b.y||a.x-b.x),regions=[];
  if(sorted.length>=3){
   const first=sorted[0],row=sorted.filter(b=>Math.abs(b.y-first.y)<first.height*.4).sort((a,b)=>a.x-b.x),next=sorted.find(b=>b.y>first.y+first.height);
   if(row.length===2&&next&&row[0].x<width*.3&&row[1].x>width*.45&&Math.abs(row[0].width-row[1].width)<width*.05){
    const stride=next.y-first.y,cardHeight=Math.max(...sorted.map(b=>b.height));
    if(stride>cardHeight*1.25&&stride<cardHeight*3&&sorted.every(b=>row.some(c=>Math.abs(c.x-b.x)<width*.025))){
     for(let i=0;i<5;i++)regions.push({kind:'subskill',index:i,x:Math.max(0,row[i%2].x-3),y:Math.max(0,first.y+Math.floor(i/2)*stride-4),width:row[i%2].width+6,height:cardHeight+8});
     const mainHeader=headers.filter(b=>b.end<first.y&&b.start>height*.1).at(-1);
     if(mainHeader)regions.push({kind:'main',x:width*.04,y:mainHeader.end+2,width:width*.92,height:first.y-mainHeader.end-8});
    }
   }
  }
  const details=headers.at(-1);
  if(details&&details.start>height*.55&&details.end<height*.9)regions.push({kind:'nature',x:width*.02,y:details.end+3,width:width*.50,height:Math.min(height*.095,height-details.end-3)});
  return regions;
 }
 function regions(canvas){
  const probe=document.createElement('canvas'),scale=Math.min(1,480/canvas.width);probe.width=Math.round(canvas.width*scale);probe.height=Math.round(canvas.height*scale);
  const context=probe.getContext('2d',{willReadFrequently:true});context.drawImage(canvas,0,0,probe.width,probe.height);
  const found=regionsFromPixels(context.getImageData(0,0,probe.width,probe.height).data,probe.width,probe.height);
  probe.width=probe.height=1;return found.map(r=>({...r,x:r.x/scale,y:r.y/scale,width:r.width/scale,height:r.height/scale}));
 }
 function crop(canvas,region){
  // Remove card borders and lock badges before reading the single skill-name line.
  if(region.kind==='subskill')region={...region,x:region.x+region.width*.06,y:region.y+region.height*.26,width:region.width*.88,height:region.height*.52};
  if(region.kind==='nature')region={...region,x:region.x+region.width*.15,y:region.y+region.height*.50,width:region.width*.75,height:region.height*.32};
  const output=document.createElement('canvas');output.width=Math.round(region.width*3);output.height=Math.round(region.height*3);
  const context=output.getContext('2d',{willReadFrequently:true});context.fillStyle='#fff';context.fillRect(0,0,output.width,output.height);context.drawImage(canvas,region.x,region.y,region.width,region.height,0,0,output.width,output.height);
  const data=context.getImageData(0,0,output.width,output.height);
  for(let i=0;i<data.data.length;i+=4){const v=data.data[i]*.299+data.data[i+1]*.587+data.data[i+2]*.114>210?255:0;data.data[i]=data.data[i+1]=data.data[i+2]=v}
  context.putImageData(data,0,0);return output;
 }
 function merge(results){
  const merged={subskills:[],candidates:unique(results.flatMap(x=>x.candidates)),conflicts:unique(results.flatMap(x=>x.conflicts))};
  const field=(values,label)=>{const distinct=unique(values);if(distinct.length>1)merged.conflicts.push(label);return distinct.length===1?distinct[0]:null};
  for(const [key,label] of [['speciesId','ポケモン'],['level','レベル'],['nature','性格'],['skillLevel','スキルLv']])merged[key]=field(results.map(x=>x[key]),label);
  for(let i=0;i<5;i++)merged.subskills[i]=field(results.map(x=>x.subskills[i]),`サブスキル ${i+1}`);
  merged.conflicts=unique(merged.conflicts);return merged;
 }
 let enginePromise=null;
 function loadEngine(){
  if(window.Tesseract)return Promise.resolve(window.Tesseract);
  if(!enginePromise)enginePromise=new Promise((resolve,reject)=>{
   const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js';script.crossOrigin='anonymous';
   const timer=setTimeout(()=>{script.remove();reject(Error('読み取り機能の準備がタイムアウトしました。もう一度お試しください。'))},40000);
   script.onload=()=>{clearTimeout(timer);window.Tesseract?resolve(window.Tesseract):reject(Error('読み取り機能を準備できませんでした。'))};
   script.onerror=()=>{clearTimeout(timer);script.remove();reject(Error('読み取り機能を取得できませんでした。通信を確認してください。'))};document.head.append(script);
  }).catch(error=>{enginePromise=null;throw error});
  return enginePromise;
 }
 async function canvas(file){
  const url=URL.createObjectURL(file),image=new Image();
  try{
   image.src=url;await image.decode();
   if(!image.naturalWidth||!image.naturalHeight)throw Error('画像を開けませんでした。');
   const scale=Math.min(2,Math.max(1,1000/image.naturalWidth),3000/Math.max(image.naturalWidth,image.naturalHeight),Math.sqrt(4000000/(image.naturalWidth*image.naturalHeight)));
   const output=document.createElement('canvas');output.width=Math.round(image.naturalWidth*scale);output.height=Math.round(image.naturalHeight*scale);
   const context=output.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,output.width,output.height);context.drawImage(image,0,0,output.width,output.height);return output;
  }finally{URL.revokeObjectURL(url)}
 }
 window.PS_IMAGE_READER={parse,merge,loadEngine,canvas,regionsFromPixels,regions,crop};
})();
</script>
