<dialog id="sleepImageDialog" class="psg-image-dialog" aria-labelledby="sleepImageTitle">
 <div class="psg-image-heading"><h2 id="sleepImageTitle">寝顔スキャン</h2><button type="button" class="btn" id="sleepImageClose">閉じる</button></div>
 <p>ポケモン名・寝顔名が写った寝顔の詳細画像を選んでください（5枚まで）。1枚に複数の寝顔が写っていても読み取れます。画像は端末内で処理します。</p>
 <label class="btn psg-image-file-label">画像を選ぶ<input type="file" id="sleepImageFiles" accept="image/png,image/jpeg,image/webp" multiple></label>
 <div id="sleepImagePreviews" class="psg-image-previews"></div>
 <div class="psg-image-actions"><button type="button" class="btn primary" id="sleepImageRead" disabled>読み取る</button><button type="button" class="btn" id="sleepImageStop" hidden>中止</button></div>
 <p id="sleepImageStatus" role="status" aria-live="polite">初回は読み取りデータを取得します。</p>
 <form id="sleepImageForm" hidden>
  <p>画像と候補を確認してください。読めなかったポケモン・寝顔は選び直せます。チェックした寝顔だけを登録します。</p>
  <div id="sleepImageResults"></div>
  <p id="sleepImageMessage" role="status"></p>
  <button type="submit" class="btn primary" id="sleepImageSave">確認して寝顔図鑑に登録</button>
 </form>
</dialog>
