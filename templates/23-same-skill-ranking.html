<script>
(()=>{
 let loading=null;
 window.PS_PAGE_RENDERERS.sameSkillRankingPage=async()=>{
  const host=document.getElementById('sameSkillRankingContent');
  if(host.dataset.ready==='true')return;
  host.textContent='比較資料を読み込み中…';
  try{
   loading??=Promise.all([fetch('master/rankings/same-skill/same_skill_top5.json').then(r=>{if(!r.ok)throw Error('資料を取得できませんでした');return r.json()}),import('./master/rankings/same-skill/selector.mjs')]).catch(e=>{loading=null;throw e});
   const [data,selector]=await loading;
   if(host.dataset.ready==='true')return;
   host.replaceChildren();host.dataset.ready='true';
   const add=(parent,tag,copy)=>{const el=document.createElement(tag);if(copy!==undefined)el.textContent=copy;parent.append(el);return el};
   const controls=add(host,'div');controls.className='psg-comparison-controls';
   const select=(labelText,options)=>{const label=add(controls,'label',labelText),el=add(label,'select');for(const [value,copy] of options){const o=add(el,'option',copy);o.value=value}return el};
   const skills=[...new Map(data.groups.map(g=>[g.skillId,g.skillName])).entries()].sort((a,b)=>a[1].localeCompare(b[1],'ja'));
   const skill=select('スキル',skills),scope=select('対象',[['all','全得意'],['skillSpecialists','スキル得意のみ']]);
   const scenario=select('回収・所持条件',Object.entries(data.scenarios).map(([id,s])=>[id,s.label]));scenario.value=data.defaultScenario;
   const output=add(host,'div');output.setAttribute('aria-live','polite');
   const render=()=>{
    output.replaceChildren();
    try{
     const result=selector.selectSkillRanking(data,{scenario:scenario.value,skillId:skill.value,scope:scope.value});
     add(output,'p',`対象 ${result.totalCandidates}体・上位5位（境界の同順位を含む）`).className='note';
     if(!result.entries.length)add(output,'p',result.emptyMessage);
     else{
      const table=add(output,'table');table.className='psg-cooking-table';
      const header=add(add(table,'thead'),'tr');for(const title of ['順位','ポケモン','得意','回／日'])add(header,'th',title).scope='col';
      const body=add(table,'tbody');
      for(const row of result.entries){const tr=add(body,'tr');add(tr,'td',String(row.rank));const link=add(add(tr,'td'),'a',row.name);link.href=window.PS_DEX_ROUTE.url(row.speciesId);add(tr,'td',row.specialty);add(tr,'td',window.PS_NUMBERS.display(row.skillTriggersPerDay));}
     }
     add(output,'p','Lv60・無補正・サブスキルなし・スキル上限Lv。睡眠8時間中は回収なし。推定値。順位は未丸め値で判定し、効果量の強さとは別に比較します。').className='note';
     const details=add(output,'details');add(details,'summary','詳しい比較条件');
     for(const [key,label] of [['carry','所持数'],['ingredients','食材'],['comparison','編成'],['clock','時計']])add(details,'p',`${label}：${result.conditions[key]}`).className='note';
     add(details,'p','起床げんき100、食事は起床直後・6時間後・12時間後。FB・キャンプ・リボン・ゾーン補正なし。発動保証や未確定の追加効果は含みません。2026年10月8日の研究資料に基づく共通条件の比較で、登録個体・現在のチームとは連動しません。').className='note';
    }catch(e){add(output,'p',`比較できません：${e.message}`)}
   };
   for(const control of [skill,scope,scenario])control.onchange=render;
   render();
  }catch(e){host.textContent=e.message;const retry=document.createElement('button');retry.type='button';retry.className='btn';retry.textContent='再読み込み';retry.onclick=()=>window.PS_PAGE_RENDERERS.sameSkillRankingPage();host.append(retry)}
 };
})();
</script>
