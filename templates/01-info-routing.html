<style>
html.psg-recipe-page main>.screen:not(#recipePage),html.psg-ingredient-page main>.screen:not(#ingredientPage){display:none!important}
</style>
<script id="psg-info-routing">
(()=>{
 const paths={recipePage:'recipes.html',ingredientPage:'ingredients.html'};
 const page=Object.keys(paths).find(key=>location.pathname.endsWith('/'+paths[key]))||null;
 window.PS_INFO_PAGE=page;
 if(page)document.documentElement.classList.add(page==='recipePage'?'psg-recipe-page':'psg-ingredient-page','psg-route-pending');
 const KEY='psn-info-pages-v1';
 function read(){try{return JSON.parse(sessionStorage.getItem(KEY)||'{}')}catch{return {}}}
 function write(value){try{sessionStorage.setItem(KEY,JSON.stringify(value))}catch{}}
 function capture(){
  const ps=window.PS;if(!ps)return;
  const data=read(),controls={};
  for(const id of ['dexSearch','boxSearch','recipeSort','recipeSupplyScenario','ingredientSearch','ingredientIndexSort','ingredientSupplyLevel','ingredientSupplyScenario']){const node=document.getElementById(id);if(node)controls[id]=node.value}
  const filters={};for(const kind of ['filters','boxFilters']){filters[kind]={};for(const [key,values] of Object.entries(ps.state[kind]))filters[kind][key]=[...values]}
  data[ps.state.screen]={controls,filters,cooking:window.PS_COOKING_VIEW_STATE?.get(),history:[...ps.state.history],scroll:window.scrollY||0,category:document.querySelector('[data-recipe-category].active')?.dataset.recipeCategory,mode:document.querySelector('[data-recipe-mode].active')?.dataset.recipeMode,openRecipes:[...document.querySelectorAll('.psg-recipe-entry[open]')].map(n=>n.dataset.recipeId),openIngredients:[...document.querySelectorAll('.psg-supply-tier[open]')].map(n=>n.dataset.ingredient)};
  write(data);
 }
 function path(screen){return paths[screen]||(['fieldPage','fieldDetail'].includes(screen)?'fields.html':'review.html')}
 function open(screen,{push=true,recipe,reference}={}){
  const ps=window.PS;capture();const data=read();
  const stack=ps?[...ps.state.history]:['info'];if(push&&ps&&ps.state.screen!==screen)stack.push(ps.state.screen);
  data.navigation={screen,history:stack};write(data);
  const target=new URL(path(screen),location.href);target.searchParams.set('screen',screen);target.searchParams.set('restore','info');if(recipe)target.searchParams.set('recipe',recipe);if(reference)target.searchParams.set('reference',reference);location.assign(target.href);
 }
 function restore(){
  const ps=window.PS;if(!ps)return;const data=read(),saved=data[ps.state.screen];
  if(data.navigation?.screen===ps.state.screen&&Array.isArray(data.navigation.history))ps.state.history=data.navigation.history;
  if(!saved)return;
  for(const kind of ['filters','boxFilters'])for(const key of Object.keys(ps.state[kind])){const v=saved.filters?.[kind]?.[key];if(Array.isArray(v))ps.state[kind][key]=new Set(v.filter(x=>typeof x==='string'))}
  if(page==='recipePage'){document.querySelector(`[data-recipe-category="${saved.category}"]`)?.click();document.querySelector(`[data-recipe-mode="${saved.mode}"]`)?.click()}
  for(const [id,value] of Object.entries(saved.controls||{})){const node=document.getElementById(id);if(node){node.value=value;node.dispatchEvent(new Event(node.type==='search'?'input':'change',{bubbles:true}))}}
  if(page&&saved.cooking)window.PS_COOKING_VIEW_STATE?.restore(saved.cooking);
  for(const node of document.querySelectorAll('.psg-recipe-entry'))if(saved.openRecipes?.includes(node.dataset.recipeId))node.open=true;
  for(const node of document.querySelectorAll('.psg-supply-tier'))if(saved.openIngredients?.includes(node.dataset.ingredient))node.open=true;
  ps.refreshAssetViews();requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,Math.max(0,Number(saved.scroll)||0))));
 }
 let cookingPromise=null;
 function ensureCooking(){
  if(window.PS_COOKING_VIEW_STATE)return Promise.resolve();if(cookingPromise)return cookingPromise;
  const load=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>{s.remove();reject(new Error('Cooking package unavailable'))};document.head.append(s)});
  cookingPromise=load(window.PS_COOKING_PACKAGE.data).then(()=>{for(const key of ['dailySupply','recipeEvaluation'])window.PS_CATALOG[key]=window.PS_COOKING_DATA[key];return load(window.PS_COOKING_PACKAGE.view)}).catch(error=>{cookingPromise=null;throw error});return cookingPromise;
 }
 window.PS_INFO_ROUTE={path,open,restore,read,ensureCooking};
 window.PS_PAGE_RENDERERS??={};window.PS_PAGE_RENDERERS.bookshelfPage=()=>ensureCooking().catch(()=>{});
})();
</script>
