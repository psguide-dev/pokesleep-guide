<style>
html.psg-route-pending main,html.psg-route-pending nav{visibility:hidden}
html.psg-pokemon-page main>.screen:not(#dexDetail){display:none!important}
#dexGrid a.dex-card{color:inherit;text-decoration:none}
</style>
<script id="psg-pokemon-routing">
(()=>{
 const KEY='psg-dex-return-v1',isDetail=location.pathname.endsWith('/pokemon.html');
 window.PS_POKEMON_PAGE=isDetail;
 if(isDetail)document.documentElement.classList.add('psg-pokemon-page');
 function read(){try{const value=JSON.parse(sessionStorage.getItem(KEY)||'null');return value&&typeof value==='object'?value:null}catch{return null}}
 function write(value){try{sessionStorage.setItem(KEY,JSON.stringify(value))}catch{}}
 const screens=new Set(['startPage','dex','home','box','info','recipePage','skillPage','fieldPage','fieldDetail','ingredientPage','nightcapPage','accountPage','bookshelfPage','expPage','sourcesPage','rankingPage','islandRankingPage','typeRankingPage','skillEnergyRankingPage','ingredientRankingPage','sameSkillRankingPage']);
 // This runs before the default home markup is parsed, preventing a home flash
 // while the destination, filters and scroll position are restored.
 if(!isDetail&&screens.has(new URLSearchParams(location.search).get('screen')))document.documentElement.classList.add('psg-route-pending');
 function capture(origin){
  if(isDetail)return;
  const ps=window.PS;if(!ps)return;
  const filters=ps.state.filters;
  write({origin:screens.has(origin||ps.state.screen)?origin||ps.state.screen:'dex',returnURL:location.href,search:document.getElementById('dexSearch').value,types:[...filters.types],ingredients:[...filters.ingredients],specs:[...filters.specs],scroll:Math.max(0,window.scrollY||0),history:ps.state.history.filter(x=>screens.has(x)),field:ps.state.screen==='fieldDetail'?window.PS_FIELD_DETAIL?.fieldId:null,savedAt:Date.now()});
 }
 function url(species,tab='ability'){
  const target=new URL('pokemon.html',location.href);target.searchParams.set('species',String(species));
  if(['sleep','field'].includes(tab))target.searchParams.set('tab',tab);return target.href;
 }
 function open(species,{tab='ability',keepScroll=false}={}){
  if(!isDetail)capture();
  if(isDetail&&keepScroll){try{sessionStorage.setItem('psg-detail-scroll-v1',JSON.stringify({species:String(species),y:window.scrollY||0}))}catch{}}
  location.assign(url(species,tab));
 }
 function returnToApp(screen){
  if(screen===undefined&&isDetail&&history.length>1&&read()?.returnURL===document.referrer){history.back();return;}
  const destination=screens.has(screen)?screen:read()?.origin||'dex';
  const target=new URL(['fieldPage','fieldDetail'].includes(destination)?'fields.html':'review.html',location.href);target.searchParams.set('screen',destination);
  target.searchParams.set('restore','dex');if(target.searchParams.get('screen')==='fieldDetail'&&read()?.field)target.searchParams.set('field',read().field);location.assign(target.href);
 }
 function syncScreen(screen){
  if(isDetail)return;
  // Individual Box records have no independent URL; reload returns to Box.
  if(screen==='boxDetail')screen='box';
  if(!screens.has(screen))return;
  const target=new URL(location.href);target.searchParams.set('screen',screen);
  if(screen!=='dex')target.searchParams.delete('restore');
  if(screen==='fieldDetail'&&window.PS_FIELD_DETAIL?.fieldId)target.searchParams.set('field',window.PS_FIELD_DETAIL.fieldId);else target.searchParams.delete('field');
  if(target.href!==location.href)history.replaceState(history.state,'',target.href);
 }
 function restore(){
  const saved=read(),ps=window.PS;if(!saved||!ps)return null;
  const values=key=>Array.isArray(saved[key])?saved[key].filter(x=>typeof x==='string').slice(0,100):[];
  document.getElementById('dexSearch').value=typeof saved.search==='string'?saved.search.slice(0,200):'';
  for(const key of ['types','ingredients','specs'])ps.state.filters[key]=new Set(values(key));
  ps.state.history=Array.isArray(saved.history)?saved.history.filter(x=>screens.has(x)):[];
  ps.refreshAssetViews();return saved;
 }
 function restorePosition(saved){if(saved&&Number.isFinite(saved.scroll))requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,Math.max(0,saved.scroll))))}
 let booted=false;
 function boot(){
  if(booted)return;booted=true;
  const params=new URLSearchParams(location.search);
  try{
  if(isDetail){
   const species=params.get('species'),tab=params.get('tab');
   if(!species||!window.openPokemonDetail?.(species,{local:true,tab:['ability','sleep','field'].includes(tab)?tab:'ability'})){
    const host=document.getElementById('dexDetail');host.replaceChildren();host.classList.add('active');const note=document.createElement('p');note.textContent='対象のポケモンが見つかりません。';const back=document.createElement('button');back.className='btn';back.textContent='図鑑へ戻る';back.onclick=()=>returnToApp('dex');host.append(note,back);return;
   }
   try{const pos=JSON.parse(sessionStorage.getItem('psg-detail-scroll-v1')||'null');if(pos?.species===species){sessionStorage.removeItem('psg-detail-scroll-v1');restorePosition({scroll:pos.y})}}catch{}
  }else{
   const screen=params.get('screen')||(window.PS_FIELD_PAGE?'fieldPage':null);if(!screens.has(screen))return;
   if(window.PS_FIELD_PAGE){const origin=window.PS_FIELD_ROUTE.read()?.origin||'info';window.PS.state.history=screen==='fieldDetail'?[origin,'fieldPage']:[origin];window.PS.state.screen=screen;}
   const saved=params.get('restore')==='dex'?restore():null;
   if(screen==='fieldDetail'){if(!window.PS_FIELD_DETAIL?.open(params.get('field')))window.PS.go('fieldPage',false);}else window.PS.go(screen,false);
   if(screen===saved?.origin)restorePosition(saved);
   if(params.get('restore')==='field')window.PS_FIELD_ROUTE.restore();
  }
  }finally{
   // Release after the queued scroll restoration, before the next paint.
   requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove('psg-route-pending')));
  }
 }
 window.PS_DEX_ROUTE={capture,url,open,returnToApp,syncScreen,boot};
 window.addEventListener('DOMContentLoaded',boot,{once:true});
 window.addEventListener('pageshow',event=>{if(!isDetail&&event.persisted){if(new URLSearchParams(location.search).get('restore')==='dex'){const saved=restore();if(saved&&window.PS.state.screen===saved.origin){window.PS.go(saved.origin,false);restorePosition(saved)}}else if(window.PS_FIELD_PAGE)window.PS_PAGE_RENDERERS?.[window.PS.state.screen]?.();else window.PS.refreshAssetViews();}});
})();
</script>
