<script id="psg-skill-index-controller">
(()=>{'use strict';
 const catalog=window.PS_CATALOG;
 const input=document.getElementById('skillSearch'),tag=document.getElementById('skillTag'),list=document.getElementById('skillIndexList'),count=document.getElementById('skillIndexCount');
 if(!catalog||!input||!list)return;
 if(tag)for(const value of [...new Set(Object.values(catalog.skills||{}).flatMap(skill=>skill.tags||[]))].sort((a,b)=>a.localeCompare(b,'ja'))){const option=document.createElement('option');option.value=value;option.textContent=value;tag.append(option)}
 const effects=(skill,level)=>{
  const value=skill.levels?.[level];
  if(skill.displayNote&&value?.description)return value.description;
  if(skill.effectType==='random_ingredients'&&Number.isFinite(value?.amount))return `ランダムな食材を${value.amount}個ゲットする`;
  if(skill.effectType==='team_energy_recovery'&&Number.isFinite(value?.recovery))return `チーム全員のげんきを${value.recovery}回復する`;
  if(skill.effectType==='fixed_energy'&&Number.isFinite(value?.energy))return `カビゴンのエナジーを${value.energy.toLocaleString()}増やす`;
  if(skill.effectType==='variable_energy'&&Number.isFinite(value?.min)&&Number.isFinite(value?.max))return `カビゴンのエナジーを${value.min.toLocaleString()}～${value.max.toLocaleString()}増やす`;
  return typeof value?.description==='string'&&value.description.trim()?value.description:'効果データ未確認';
 };
 function render(){
  const query=input.value.trim().toLocaleLowerCase('ja');
  const all=Object.values(catalog.skills||{});
  const matches=all.filter(s=>(!tag?.value||(s.tags||[]).includes(tag.value))&&[s.name,...(s.tags||[]),...(s.nativeSpecies||[]).map(p=>p.name)].some(value=>String(value).toLocaleLowerCase('ja').includes(query)));
  count.textContent=`${matches.length} / ${all.length} スキル`;
  list.replaceChildren();
  if(!matches.length){const empty=document.createElement('p');empty.className='note';empty.textContent='該当するスキルはありません。';list.append(empty);return}
  matches.forEach(skill=>{
   const species=window.PS_SPECIES_CATALOG.all(catalog).filter(p=>p.dexVisible&&p.mainSkillId===skill.id);
   const item=document.createElement('details');item.className='psg-skill-entry';
   const summary=document.createElement('summary');
   const title=document.createElement('strong');
   const nameParts=skill.name.match(/^(.*?)([（(].*[）)])$/);
   if(nameParts){const main=document.createElement('span'),qualifier=document.createElement('span');main.textContent=nameParts[1];qualifier.textContent=nameParts[2];qualifier.className='psg-skill-qualifier';title.append(main,qualifier)}else title.textContent=skill.name;
   const tags=document.createElement('span');tags.className='psg-skill-tags';tags.textContent=(skill.tags||[]).join(' · ');
   const iconSlot=document.createElement('span');iconSlot.className='psg-skill-entry-icon';
   const iconSrc=window.PS_IMAGE_FILES?.skills?.[skill.id];if(iconSrc){const icon=document.createElement('img');icon.src=iconSrc;icon.alt='';icon.width=36;icon.height=36;icon.style.objectFit='contain';iconSlot.append(icon)}summary.append(iconSlot);
   summary.append(title,tags);item.append(summary);
   const rows=document.createElement('div');rows.className='psg-skill-levels';
   for(let level=1;level<=Math.min(10,Number(skill.maxLevel)||0);level++){
    const row=document.createElement('div');row.className='psg-skill-level';
    const label=document.createElement('b');label.textContent=`Lv.${level}`;
    const description=document.createElement('span');description.textContent=effects(skill,level);
    row.append(label,description);rows.append(row);
   }
   item.append(rows);
   if(skill.displayNote){const note=document.createElement('p');note.className='note';note.textContent=skill.displayNote;item.append(note)}
   if(skill.ruleNotes?.length){
    const conditions=document.createElement('details');conditions.className='psg-skill-conditions';
    const label=document.createElement('summary');label.textContent='発動条件・持続';conditions.append(label);
    const sources=new Map();
    for(const note of skill.ruleNotes){const p=document.createElement('p'),title=document.createElement('b');title.textContent=note.label+'：';p.append(title,document.createTextNode(note.text));conditions.append(p);for(const source of note.sources)sources.set(source.url,source)}
    if(skill.effectRules?.unknowns?.length){const heading=document.createElement('b');heading.textContent='未確認の項目';conditions.append(heading);for(const text of skill.effectRules.unknowns){const p=document.createElement('p');p.className='note';p.textContent=text;conditions.append(p)}}
    item.append(conditions);
   }
   const heading=document.createElement('div');heading.className='psg-skill-species-label';heading.textContent='このスキルを持つポケモン';item.append(heading);
   const links=document.createElement('div');links.className='psg-skill-species';
   if(!species.length&&!skill.nativeSpecies?.length){const empty=document.createElement('span');empty.textContent='現在の図鑑に登録なし';links.append(empty)}
   for(const p of skill.nativeSpecies||[]){if(species.some(s=>s.speciesId===p.speciesId))continue;const pending=document.createElement('span');pending.className='note';pending.textContent=`${p.name}（図鑑追加待ち）`;links.append(pending)}
   species.forEach(p=>{
    const button=document.createElement('button');button.type='button';button.className='btn';button.textContent=`No.${String(p.no).padStart(3,'0')} ${p.name}`;
    button.onclick=()=>window.openPokemonDetail?.(p.speciesId||p.no,{pushHistory:false});links.append(button);
   });item.append(links);list.append(item);
  });
 }
 input.addEventListener('input',render);
 tag?.addEventListener('change',render);
 window.PS_PAGE_RENDERERS??={};let skillListReady=false;
 window.PS_PAGE_RENDERERS.skillPage=()=>{if(!skillListReady){render();skillListReady=true}};
