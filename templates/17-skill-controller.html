<script id="psg-skill-index-controller">
(()=>{'use strict';
 const catalog=window.PS_CATALOG;
 const input=document.getElementById('skillSearch'),tag=document.getElementById('skillTag'),list=document.getElementById('skillIndexList'),count=document.getElementById('skillIndexCount');
 if(!catalog||!input||!list)return;
 // Keep base skills and their variants together by the effect they provide.
 const effectGroups=[
  ['energy_charge_s_fixed','energy_charge_s_variable','stockpile_energy_charge_s','energy_charge_m','nightmare_energy_charge_m'],
  ['energy_charge_s_self','moonlight_energy_charge_s','energy_cheer_s','healing_pulse_energy_cheer_s','nuzzle_energy_cheer_s','energy_for_everyone_s','berry_juice_energy_for_everyone','lunar_blessing_energy_for_everyone_s'],
  ['ingredient_magnet_s','plus_ingredient_magnet_s','present_ingredient_magnet_s','ingredient_draw_s','super_luck_ingredient_select_s','hyper_cutter_ingredient_select_s'],
  ['berry_burst','disguise_berry_burst','draco_meteor_berry_burst','psystrike_berry_zone'],
  ['extra_helpful_s','helper_boost_electric','helper_boost_fire','helper_boost_water'],
  ['cooking_power_up_s','minus_cooking_power_up_s','cooking_chance_s','bulk_up_cooking_assist_s'],
  ['dream_shard_magnet_s','dream_shard_magnet_s_variable','aura_sphere_dream_shards'],
  ['metronome','mimic_skill_copy','transform_skill_copy'],
  ['almighty']
 ];
 const effectOrder=new Map(effectGroups.flat().map((id,index)=>[id,index]));
 if(tag)for(const value of [...new Set(Object.values(catalog.skills||{}).flatMap(skill=>skill.tags||[]))].sort((a,b)=>a.localeCompare(b,'ja'))){const option=document.createElement('option');option.value=value;option.textContent=value;tag.append(option)}
 const effects=(skill,level)=>{
  const value=skill.levels?.[level];
  if(skill.displayNote&&value?.description)return value.description;
  if(skill.effectType==='random_ingredients'&&Number.isFinite(value?.amount))return `ランダムな食材を${value.amount}個ゲットする`;
  if(skill.effectType==='team_energy_recovery'&&Number.isFinite(value?.recovery))return `チーム全員のげんきを${value.recovery}回復する`;
  if(skill.effectType==='fixed_energy'&&Number.isFinite(value?.energy))return `カビゴンのエナジーを${value.energy.toLocaleString()}増やす`;
  if(skill.effectType==='variable_energy'&&Number.isFinite(value?.min)&&Number.isFinite(value?.max))return `カビゴンのエナジーを${value.min.toLocaleString()}～${value.max.toLocaleString()}増やす`;
  return typeof value?.description==='string'&&value.description.trim()?value.description:'効果データ未確認';
 };
 const range=values=>{const numbers=Object.values(values).filter(Number.isFinite),min=Math.min(...numbers),max=Math.max(...numbers);return min===max?min.toLocaleString():min.toLocaleString()+'〜'+max.toLocaleString()};
 function previewEffect(skill){
  const x=skill.levels?.[1]||{},n=x.namedValues||{},type=skill.effectType;
  if(n.spitEnergyByStoredCount)return `エナジー ${range(n.spitEnergyByStoredCount)}`;
  if(n.selfBerriesByDistinctCount)return (n.recoveryPerTeamMember!=null?`全員のげんき＋${n.recoveryPerTeamMember}／`:'')+`きのみ：自分 ${range(n.selfBerriesByDistinctCount)}個／他の各匹 ${range(n.berriesPerOtherMemberByDistinctCount)}個`;
  if(skill.id==='disguise_berry_burst')return `きのみ：自分 ${n.selfBerries}個／他の各匹 ${n.berriesPerOtherMember}個（大成功3倍）`;
  if(n.directEnergy!=null)return `エナジー ${n.directEnergy.toLocaleString()}`+(n.zoneIncreasePercentagePoints!=null?`／ゾーン＋${n.zoneIncreasePercentagePoints}%`:`／あく以外のげんき−${n.energyLossPerNonDarkMember}`);
  if(n.randomIngredientTotalBase!=null)return `食材 ${n.randomIngredientTotalBase}個／条件で追加 ${range(n.additionalByFirstIngredient)}個`;
  if(n.potIncrease!=null)return `鍋＋${n.potIncrease}個／条件でげんき＋${n.conditionalRecovery}`;
  if(n.recoveryPerTarget!=null)return `2匹のげんき＋${n.recoveryPerTarget}／おてつだい${n.instantHelpsPerTarget}〜${n.instantHelpsPerTarget+n.conditionalAdditionalHelpsPerTarget}回`;
  if(n.bonusDrawCount!=null)return `1匹のげんき＋${n.displayRecovery}／スキルを${n.bonusDrawCount}回抽選`;
  if(n.baseCandy!=null)return `セットしたスキル＋アメ${n.baseCandy}個`;
  if(type==='variable_energy')return `エナジー ${x.min.toLocaleString()}〜${x.max.toLocaleString()}`;
  if(type==='variable_dream_shards')return `ゆめのかけら ${x.min.toLocaleString()}〜${x.max.toLocaleString()}個`;
  if(type==='fixed_dream_shards_energy')return `ゆめのかけら ${x.shards}個／エナジー ${x.energy}`;
  if(x.energy!=null)return `エナジー ${x.energy.toLocaleString()}`;
  if(x.selfRecovery!=null)return `自分のげんき＋${x.selfRecovery}／大成功で1匹のげんき＋${x.bonusRecovery}`;
  if(x.recovery!=null)return `${type==='self_energy_recovery'?'自分':type==='ally_energy_recovery'?'1匹':'全員'}のげんき＋${x.recovery}`+(skill.id==='berry_juice_energy_for_everyone'?'／きのみジュース':'');
  if(type==='berry_burst')return `きのみ：自分 ${x.selfBerries}個／他の各匹 ${x.teamBerriesEach}個`;
  if(type?.startsWith('helper_boost_')){const bonus=Object.entries(x).find(([key])=>key.startsWith('bonusByUnique'))?.[1]||[0];return `全員のおてつだい${x.helps}〜${x.helps+Math.max(...bonus)}回`}
  if(x.helps!=null)return `1匹のおてつだい${x.helps}回`;
  if(x.capacity!=null)return `鍋＋${x.capacity}個`;
  if(x.chancePercent!=null)return `大成功確率を${x.chancePercent}%追加`;
  if(x.shards!=null)return `ゆめのかけら ${x.shards}個`;
  if(type==='random_main_skill')return 'メインスキルをランダム発動';
  if(type==='team_skill_copy')return '仲間のスキルをランダム発動';
  if(x.amount!=null)return `食材 ${x.amount}個`+(x.bonusCandy!=null?`／ときどきアメ${x.bonusCandy}個`:x.chanceBonus!=null?`／大成功確率を${x.chanceBonus}%追加`:x.shardsSmall!=null?` または ゆめのかけら ${x.shardsSmall.toLocaleString()}個か${x.shardsLarge.toLocaleString()}個`:x.bonusAmount!=null?`／大成功で追加${x.bonusAmount}個`:'');
  return effects(skill,1);
 }
 function render(){
  const query=input.value.trim().toLocaleLowerCase('ja');
  const all=Object.values(catalog.skills||{});
  const matches=all.filter(s=>(!tag?.value||(s.tags||[]).includes(tag.value))&&[s.name,...(s.tags||[]),...(s.nativeSpecies||[]).map(p=>p.name)].some(value=>String(value).toLocaleLowerCase('ja').includes(query)));
  matches.sort((a,b)=>(effectOrder.get(a.id)??Infinity)-(effectOrder.get(b.id)??Infinity)||a.name.localeCompare(b.name,'ja'));
  count.textContent=`${matches.length} / ${all.length}`;
  list.replaceChildren();
  if(!matches.length){const empty=document.createElement('p');empty.className='note';empty.textContent='該当するスキルはありません。';list.append(empty);return}
  matches.forEach(skill=>{
   const species=window.PS_SPECIES_CATALOG.all(catalog).filter(p=>p.dexVisible&&p.mainSkillId===skill.id);
   const item=document.createElement('details');item.className='psg-skill-entry';
   const summary=document.createElement('summary');
   const title=document.createElement('strong');
   const nameParts=skill.name.match(/^(.*?)([（(].*[）)])$/);
   if(nameParts){const main=document.createElement('span'),qualifier=document.createElement('span');main.textContent=nameParts[1];qualifier.textContent=nameParts[2];qualifier.className='psg-skill-qualifier';title.append(main,qualifier)}else title.textContent=skill.name;
   const tags=document.createElement('span');tags.className='psg-skill-tags';tags.textContent=(skill.tags||[]).join(' · ');
   const iconSlot=document.createElement('span');iconSlot.className='psg-skill-entry-icon';
   const iconSrc=window.PS_IMAGE_FILES?.skills?.[skill.id];if(iconSrc){const icon=document.createElement('img');icon.src=iconSrc;icon.alt='';icon.width=36;icon.height=36;icon.style.objectFit='contain';iconSlot.append(icon)}summary.append(iconSlot);
   const identity=document.createElement('span');identity.className='psg-skill-identity';identity.append(title,tags);
   const preview=document.createElement('span');preview.className='psg-skill-effect-preview';
   const previewLevel=document.createElement('span');previewLevel.className='psg-skill-preview-level';previewLevel.textContent='Lv.1';
   const previewCopy=document.createElement('span');
   const compactEffect=previewEffect(skill);
   if(window.PS_SKILL_DESCRIPTION)previewCopy.innerHTML=window.PS_SKILL_DESCRIPTION(skill,{description:compactEffect});else previewCopy.textContent=compactEffect;
   preview.append(previewLevel,previewCopy);summary.append(identity,preview);item.append(summary);
   const detailHeading=document.createElement('div');detailHeading.className='psg-skill-detail-heading';detailHeading.textContent='スキルの詳細';item.append(detailHeading);
   const rows=document.createElement('div');rows.className='psg-skill-levels';
   for(let level=1;level<=Math.min(10,Number(skill.maxLevel)||0);level++){
    const row=document.createElement('div');row.className='psg-skill-level';
    const label=document.createElement('b');label.textContent=`Lv.${level}`;
    const description=document.createElement('span');if(window.PS_SKILL_DESCRIPTION)description.innerHTML=window.PS_SKILL_DESCRIPTION(skill,skill.levels?.[level]);else description.textContent=effects(skill,level);
    row.append(label,description);rows.append(row);
   }
   if(skill.displayNote){const note=document.createElement('p');note.className='note';note.textContent=skill.displayNote;item.append(note)}
   if(skill.ruleNotes?.length){
    const conditions=document.createElement('details');conditions.className='psg-skill-conditions';
    const label=document.createElement('summary');label.textContent='発動条件・持続';conditions.append(label);
    const sources=new Map();
    for(const note of skill.ruleNotes){const p=document.createElement('p'),title=document.createElement('b');title.textContent=note.label+'：';p.append(title,document.createTextNode(note.text));conditions.append(p);for(const source of note.sources)sources.set(source.url,source)}
    if(skill.effectRules?.unknowns?.length){const heading=document.createElement('b');heading.textContent='未確認の項目';conditions.append(heading);for(const text of skill.effectRules.unknowns){const p=document.createElement('p');p.className='note';p.textContent=text;conditions.append(p)}}
    item.append(conditions);
   }
   item.append(rows);
   const heading=document.createElement('div');heading.className='psg-skill-species-label';heading.textContent='このスキルを持つポケモン';item.append(heading);
   const links=document.createElement('div');links.className='psg-skill-species';
   if(!species.length&&!skill.nativeSpecies?.length){const empty=document.createElement('span');empty.textContent='現在の図鑑に登録なし';links.append(empty)}
   for(const p of skill.nativeSpecies||[]){if(species.some(s=>s.speciesId===p.speciesId))continue;const pending=document.createElement('span');pending.className='note';pending.textContent=`${p.name}（図鑑追加待ち）`;links.append(pending)}
   species.forEach(p=>{
    const button=document.createElement('button');button.type='button';button.className='btn';button.textContent=`No.${String(p.no).padStart(3,'0')} ${p.name}`;
    button.onclick=()=>window.openPokemonDetail?.(p.speciesId||p.no,{pushHistory:false});links.append(button);
   });item.append(links);list.append(item);
  });
 }
 input.addEventListener('input',render);
 tag?.addEventListener('change',render);
 window.PS_PAGE_RENDERERS??={};let skillListReady=false;
 window.PS_PAGE_RENDERERS.skillPage=()=>{if(!skillListReady){render();skillListReady=true}};
