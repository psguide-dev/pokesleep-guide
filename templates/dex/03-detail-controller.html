<script id="stable-v12-controller">
(()=>{
 const V=window.PS_CATALOG;if(!V)return;
 const detailEsc=value=>String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
 let currentNo=1,currentSpeciesId=null,currentTab="ability";
 const byNo=n=>V.pokemon[Number(String(n).replace(/_default$/, ''))]||window.PS_FORMS?.resolve(String(n))||window.PS_FORMS?.dexEntries.find(p=>p.no===Number(n))||null;
 const detailKey=p=>p.speciesId||`${String(p.no).padStart(4,'0')}_default`;
 const neighborOf=(current,direction)=>{
   const known=[...Object.values(V.pokemon),...(window.PS_FORMS?.dexEntries||[])]
     .filter(p=>p&&Number.isInteger(Number(p.no))&&p.name)
     .sort((a,b)=>a.no-b.no||Number(!!a.speciesId)-Number(!!b.speciesId)||detailKey(a).localeCompare(detailKey(b)));
   const key=window.PS_FORMS?.groupFor(detailKey(current))?.choices[0].speciesId||detailKey(current);
   const index=known.findIndex(p=>detailKey(p)===key);
   return index<0?null:known[index+direction]||null;
 };
 const skillOf=m=>m?V.skills[m.mainSkillId]:null;

 const TYPE_THEME=window.PS_TYPE_THEME;
 const TYPE_ICONS={
   "くさ":"🌿","ほのお":"🔥","みず":"💧","でんき":"⚡","こおり":"❄️",
   "かくとう":"🥊","どく":"☠️","じめん":"⛰️","ひこう":"🪽","エスパー":"🔮",
   "むし":"🐛","いわ":"🪨","ゴースト":"👻","ドラゴン":"🐉","あく":"🌑",
   "はがね":"⚙️","フェアリー":"✨","ノーマル":"◯"
 };
 const iconForType=type=>TYPE_ICONS[type]||"◯";
 function setTheme(type){
   const [bg,accent]=TYPE_THEME[type]||["#f3f6f4","#718078"];
   const d=document.getElementById("dexDetail");
   d.style.setProperty("--type-bg",bg);d.style.setProperty("--type-accent",accent);
   d.closest("main")?.style.setProperty("--dex-type-bg",bg);
 }
 function show(id){
   document.querySelectorAll(".screen").forEach(x=>x.classList.toggle("active",x.id===id));
   if(window.PS?.state)window.PS.state.screen=id;
   window.scrollTo(0,0);
 }
 // Legacy local navigation fallback. Public detail entries use pokemon.html.
 const detailHistory=[],detailForward=[];
 let detailOrigin="dex";
 const info=document.querySelector("#dexDetail .hero-info");
 const stats=document.querySelector("#dexDetail .hero > .stats")||document.querySelector("#dexDetail .hero-info .stats");
 if(info&&stats&&stats.parentElement!==info) info.appendChild(stats);

 // Remove legacy duplicated identity/traits and legacy tab strip.
 ["detailTraits","detailName"].forEach(id=>document.getElementById(id)?.remove());
 document.querySelectorAll("#dexDetail .detail-tabs").forEach(x=>x.remove());

 // Resolve the hero before it is referenced below.
 // v54 referenced `hero` before this const declaration, which throws a ReferenceError
 // and aborts the whole detail controller before openDexCard is registered.
 const hero=document.querySelector("#dexDetail .hero");
 let tabs=document.getElementById("v12Tabs");
 if(!tabs){
   tabs=document.createElement("div");tabs.id="v12Tabs";tabs.className="v12-tabs";
   tabs.innerHTML='<button data-v12tab="ability">基本能力</button><button data-v12tab="sleep">寝顔図鑑 <span class="psg-sleep-tab-count"></span></button><button data-v12tab="field">フィールド</button>';
   hero?.appendChild(tabs);
 }
 // Everything after hero becomes the switchable area. Existing ability sections are grouped.
 let ability=document.getElementById("v12Ability");
 if(!ability){
   ability=document.createElement("div");ability.id="v12Ability";ability.className="v12-panel";
   const movable=[];
   let node=hero?.nextElementSibling;
   while(node){
     const next=node.nextElementSibling;
     if(!node.matches("nav,.bottom-nav")) movable.push(node);
     node=next;
   }
   movable.forEach(n=>ability.appendChild(n));
   hero?.after(ability);
 }
 
 // Remove legacy headings/table header that are replaced by the current renderers.
 // This fixes the visible duplicate UI without deleting the CSS/layout that v17 relies on.
 ability.querySelectorAll(".ability-card").forEach(card=>{
   const title=card.querySelector(":scope > .ability-title");
   const legacyFoodHead=card.querySelector(":scope > .food-table-head");
   if(title) title.remove();
   if(legacyFoodHead) legacyFoodHead.remove();
 });

 let sleep=document.getElementById("v12Sleep");
 if(!sleep){sleep=document.createElement("div");sleep.id="v12Sleep";sleep.className="v12-panel";ability.after(sleep)}
 let field=document.getElementById("v12Field");
 if(!field){field=document.createElement("div");field.id="v12Field";field.className="v12-panel";field.innerHTML='<div class="v12-placeholder">フィールドデータをここに表示します</div>';sleep.after(field)}
 // Pin identity and tab navigation together, while keeping the tabs outside the type-colored card.
 let sticky=document.getElementById('psgDexSticky');
 if(!sticky){
   sticky=document.createElement('div');sticky.id='psgDexSticky';sticky.className='psg-dex-sticky';
   hero.before(sticky);sticky.append(hero,tabs);
 }
 // Match the normal-flow position; a hard-coded top lets the card drift before sticking.
 function updateDexStickyTop(){
   const detail=document.getElementById('dexDetail'),head=detail?.querySelector('.detail-head');
   if(!head||!detail.classList.contains('active'))return;
   const style=getComputedStyle(head),height=head.getBoundingClientRect().height;
   if(height>0)detail.style.setProperty('--dex-sticky-top',`${(parseFloat(style.top)||0)+height+(parseFloat(style.marginBottom)||0)}px`);
 }
 const dexHead=document.querySelector('#dexDetail .detail-head');
 if(window.ResizeObserver&&dexHead)new ResizeObserver(updateDexStickyTop).observe(dexHead);
 window.addEventListener('resize',updateDexStickyTop,{passive:true});
