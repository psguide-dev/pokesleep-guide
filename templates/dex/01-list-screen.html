<section id="dex" class="screen">
<div class="psg-list-sticky">
<div class="toolbar psg-dex-toolbar psg-screen-toolbar"><h2 class="psg-screen-title">ポケモン図鑑<span class="note" id="dexCount" aria-live="polite">0 / 0</span></h2><input id="dexSearch" placeholder="名前検索"><button type="button" class="btn" id="sleepImageOpen">寝顔スキャン</button></div>
<div class="compact-filter" id="dexCompactFilters">
 <div class="dex-filter-controls">
  <div class="filter-select" data-menu="dex-type"><button class="filter-main" aria-expanded="false">タイプ <span>▼</span></button><div class="filter-panel" id="typeFilters" aria-label="タイプで絞り込み"></div></div>
  <div class="filter-select" data-menu="dex-ing"><button class="filter-main" aria-expanded="false">食材 <span>▼</span></button><div class="filter-panel" id="ingredientFilters" aria-label="食材で絞り込み"></div></div>
  <div class="filter-select" data-menu="dex-spec"><button class="filter-main" aria-expanded="false">得意 <span>▼</span></button><div class="filter-panel" id="specialtyFilters" aria-label="得意で絞り込み">
   <button class="filter-option" data-spec="きのみ"><img class="psg-specialty-icon" data-specialty-icon="berry" alt="">きのみ</button>
   <button class="filter-option" data-spec="食材"><img class="psg-specialty-icon" data-specialty-icon="ingredient" alt="">食材</button>
   <button class="filter-option" data-spec="スキル"><img class="psg-specialty-icon" data-specialty-icon="skill" alt="">スキル</button>
   <button class="filter-option" data-spec="オール"><img class="psg-specialty-icon" data-specialty-icon="all" alt="">オール</button>
  </div></div>
  <button type="button" class="filter-main" id="dexSleepMissing" aria-pressed="false">寝顔未登録</button>
 </div>
</div>
<div id="dexSelectedFilters" class="psg-selected-filters" aria-label="選択中の絞り込み条件" hidden></div>
</div>
<div id="dexGrid" class="grid"></div><div id="dexEmpty" class="card empty">図鑑データは次段階で再調査して投入します。<br>未確認値は推測で埋めません。</div>
</section>
