<script id="psg-dex-catalog-adapter">
(()=>{
/* Dex cards share the same records and Pokédex order as the detail renderer. */
if(window.PS?.master&&window.PS_CATALOG){
 window.PS.master.pokemon.splice(0,window.PS.master.pokemon.length,
  ...[...Object.values(window.PS_CATALOG.pokemon),...(window.PS_FORMS?.dexEntries||[])].filter(p=>p.dexVisible).sort((a,b)=>Number(a.no)-Number(b.no))
 );
 // The catalog arrives after the controller initializes; generate its filters now.
 window.PS.refreshAssetViews?.();
}
})();
</script>
