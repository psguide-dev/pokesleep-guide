<script id="psg-three-mode-rankings">
(()=>{
 const pages={typeRankingPage:['berry','typeRankingContent'],skillEnergyRankingPage:['total','skillEnergyRankingContent'],sameSkillRankingPage:['skill','sameSkillRankingContent'],ingredientRankingPage:['food','ingredientRankingContent']};
 const selections=new Map(),tokens=new Map();let loading;
 const load=()=>loading??=(fetch('assets/rankings/three-modes-lv80.json?v=674').then(r=>{if(!r.ok)throw Error('ランキングを読み込めませんでした。');return r.json()}).then(data=>{if(data.schemaVersion!==2||data.level!==80||data.subskillSlots!==5||data.tables.length!==552)throw Error('ランキングの形式を確認できませんでした。');return data}).catch(e=>{loading=null;throw e}));
 function node(parent,tag,text){const n=document.createElement(tag);if(text!=null)n.textContent=text;parent.append(n);return n}
 function details(parent,title){const n=node(parent,'details');node(n,'summary',title);return n}
 const labels={ideal:'理想値',median:'中央値',neutral:'無補正'};
 for(const [pageId,[kind,hostId]] of Object.entries(pages)){
  const page=document.getElementById(pageId);page.dataset.threeModeReady='true';
  window.PS_PAGE_RENDERERS[pageId]=async()=>{
   const token={};tokens.set(pageId,token);const host=document.getElementById(hostId),mode=page.querySelector('[data-ranking-basis]').value,camp=window.PS.getGoodCamp();host.replaceChildren();node(host,'p','読み込み中…');
   try{
    const data=await load();if(tokens.get(pageId)!==token||camp!==window.PS.getGoodCamp()||mode!==page.querySelector('[data-ranking-basis]').value)return;
    host.replaceChildren();
    const label=node(host,'label',kind==='skill'?'スキル ':kind==='food'?'食材 ':'タイプ '),select=node(label,'select');select.setAttribute('aria-label',kind==='skill'?'ランキングのスキル':kind==='food'?'ランキングの食材':'ランキングのタイプ');
    for(const name of data.groups[kind]){const option=node(select,'option',name);option.value=name}
    select.value=selections.get(kind)||data.groups[kind][0];const results=node(host,'div');
    function render(){
     selections.set(kind,select.value);results.replaceChildren();
     const table=data.tables.find(t=>t.kind===kind&&t.group===select.value&&t.mode===mode&&t.camp===camp);
     if(!table){node(results,'p','この条件の資料は未登録です。');return}
     node(results,'p',`Lv.${data.level}・${labels[mode]}・上位10件`);
     if(table.partial)node(results,'p','換算に対応した種類のみの暫定順位です。未算定の種類は順位に含めていません。');
     const wrap=node(results,'div');wrap.className='psg-cooking-table-wrap';const grid=node(wrap,'table');grid.className='psg-cooking-table psg-ranking-list';const head=node(grid,'thead'),hr=node(head,'tr');for(const title of ['順位','顔','個体条件',table.unit])node(hr,'th',title).scope='col';const body=node(grid,'tbody');
     for(const entry of table.rows){
      const tr=node(body,'tr');node(tr,'td',entry.rank);
      const portraitCell=node(tr,'td'),face=node(portraitCell,'button');face.type='button';face.className='psg-ranking-face';face.setAttribute('aria-label',entry.name);face.title=entry.name+'の詳細';face.onclick=()=>window.openPokemonDetail?.(entry.speciesId);
      const no=Number(entry.speciesId.split('_')[0]),species=window.PS_FORMS?.resolve(entry.speciesId)||window.PS_CATALOG?.pokemon?.[no],images=window.PS_IMAGE_FILES;
      const portrait=images?.pokemonFacesBySpecies?.[entry.speciesId]||species?.faceImage||(entry.speciesId.endsWith('_default')?images?.pokemonFaces?.[no]:null)||images?.pokemonBySpecies?.[entry.speciesId]||species?.image;
      if(portrait){
       if(window.PS_DEV_ASSETS?.image)face.innerHTML=window.PS_DEV_ASSETS.image(portrait,'pokemon',entry.speciesId.endsWith('_default')?no:entry.speciesId,'face',entry.name);
       else{const img=node(face,'img');img.src=portrait;img.alt=entry.name;img.width=48;img.height=48;img.loading='lazy'}
      }else node(face,'span','画像未登録');
      const cell=node(tr,'td');node(cell,'strong',entry.name).className='psg-ranking-name';
      const foodRow=node(cell,'div');foodRow.className='psg-ranking-foods';foodRow.setAttribute('aria-label','食材構成 '+entry.pattern);
      function conditionIcon(host,name,src,level){
       const badge=node(host,'span');badge.className='psg-ranking-badge';
       if(src){const img=node(badge,'img');img.src=src;img.alt=level?`Lv.${level} ${name}`:name;img.title=img.alt;img.width=22;img.height=22;img.loading='lazy'}
       else node(badge,'span',name);
       if(level)node(badge,'small',level);
      }
      for(const name of entry.ingredients)conditionIcon(foodRow,name,images?.ingredients?.[name]||window.PS_CATALOG?.ingredientAssets?.[name]?.image);
      node(foodRow,'small',entry.pattern).className='psg-ranking-pattern';
      const subRow=node(cell,'div');subRow.className='psg-ranking-subskills';subRow.setAttribute('aria-label','サブスキル');
      for(const [i,name] of entry.subskills.entries())conditionIcon(subRow,name,images?.subskills?.[name],entry.orderedSubskills?[10,25,50,70,80][i]:null);
      if(!entry.subskills.length)node(subRow,'small','サブスキル補正なし');
      node(cell,'div',`${entry.nature}・スキルLv.${entry.skillLevel}`).className='psg-ranking-meta';
      if(kind==='food'&&entry.speciesIdealPercent!=null&&entry.patternIdealPercent!=null)node(cell,'div',`種族 ${entry.speciesIdealPercent.toFixed(1)}％／構成 ${entry.patternIdealPercent.toFixed(1)}％`).className='psg-ranking-ratios';
      node(tr,'td',window.PS_NUMBERS.display(entry.value)).className='psg-ranking-value';
     }
     if(!table.rows.length)node(results,'p','計算対応の候補はありません。');
     if(table.pending.length){const pending=details(results,`未算定 ${table.pending.length}件`);for(const row of table.pending)node(pending,'p',typeof row==='string'?row:row.name+(row.reason?'：'+row.reason:''))}
     const conditions=details(results,'比較条件');
     for(const note of data.notes)node(conditions,'p',note);
     node(conditions,'p','理想値は同じ個体条件で最大値、中央値は（姿ごとの性格制限を含む）性格と重複なしのサブスキル5種を等重みで比較した下側50％分位です。捕獲時の出現頻度を表す分布ではありません。無補正は性格・サブスキルの補正なし。キャンチケは上部の切替を反映します。');
    }
    select.onchange=render;render();
   }catch(e){if(tokens.get(pageId)!==token)return;host.replaceChildren();node(host,'p',e.message);const retry=node(host,'button','再読み込み');retry.type='button';retry.className='btn';retry.onclick=window.PS_PAGE_RENDERERS[pageId]}
  };
 }
 function refresh(){for(const id of Object.keys(pages))if(document.getElementById(id).classList.contains('active'))window.PS_PAGE_RENDERERS[id]()}
 window.addEventListener('psg-camp-change',refresh);window.addEventListener('psg-ranking-basis-change',refresh);
})();
</script>
