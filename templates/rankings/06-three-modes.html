<script id="psg-three-mode-rankings">
(()=>{
 const pages={typeRankingPage:['berry','typeRankingContent'],skillEnergyRankingPage:['total','skillEnergyRankingContent'],sameSkillRankingPage:['skill','sameSkillRankingContent'],ingredientRankingPage:['food','ingredientRankingContent']};
 const selections=new Map(),tokens=new Map();let loading;
 const load=()=>loading??=(fetch('assets/rankings/three-modes-v1.json?v=667').then(r=>{if(!r.ok)throw Error('ランキングを読み込めませんでした。');return r.json()}).then(data=>{if(data.schemaVersion!==1||data.tables.length!==552)throw Error('ランキングの形式を確認できませんでした。');return data}).catch(e=>{loading=null;throw e}));
 function node(parent,tag,text){const n=document.createElement(tag);if(text!=null)n.textContent=text;parent.append(n);return n}
 function details(parent,title){const n=node(parent,'details');node(n,'summary',title);return n}
 const labels={ideal:'理想値',median:'中央値',neutral:'無補正'};
 for(const [pageId,[kind,hostId]] of Object.entries(pages)){
  const page=document.getElementById(pageId);page.dataset.threeModeReady='true';
  window.PS_PAGE_RENDERERS[pageId]=async()=>{
   const token={};tokens.set(pageId,token);const host=document.getElementById(hostId),mode=page.querySelector('[data-ranking-basis]').value,camp=window.PS.getGoodCamp();host.replaceChildren();node(host,'p','読み込み中…');
   try{
    const data=await load();if(tokens.get(pageId)!==token||camp!==window.PS.getGoodCamp()||mode!==page.querySelector('[data-ranking-basis]').value)return;
    host.replaceChildren();
    const label=node(host,'label',kind==='skill'?'スキル ':kind==='food'?'食材 ':'タイプ '),select=node(label,'select');select.setAttribute('aria-label',kind==='skill'?'ランキングのスキル':kind==='food'?'ランキングの食材':'ランキングのタイプ');
    for(const name of data.groups[kind]){const option=node(select,'option',name);option.value=name}
    select.value=selections.get(kind)||data.groups[kind][0];const results=node(host,'div');
    function render(){
     selections.set(kind,select.value);results.replaceChildren();
     const table=data.tables.find(t=>t.kind===kind&&t.group===select.value&&t.mode===mode&&t.camp===camp);
     if(!table){node(results,'p','この条件の資料は未登録です。');return}
     node(results,'p',`Lv.60・${labels[mode]}・上位10件`);
     if(table.partial)node(results,'p','換算に対応した種類のみの暫定順位です。未算定の種類は順位に含めていません。');
     const wrap=node(results,'div');wrap.className='psg-cooking-table-wrap';const grid=node(wrap,'table');grid.className='psg-cooking-table';const head=node(grid,'thead'),hr=node(head,'tr');for(const title of ['順位','ポケモン',table.unit])node(hr,'th',title).scope='col';const body=node(grid,'tbody');
     for(const entry of table.rows){
      const tr=node(body,'tr');node(tr,'td',entry.rank);const cell=node(tr,'td');
      const button=node(cell,'button',entry.name+(entry.provisional?'（暫定）':''));button.type='button';button.className='psg-supply-provider';button.onclick=()=>window.openPokemonDetail?.(entry.speciesId);
      const info=details(cell,kind==='food'?`食材構成 ${entry.pattern}`:'個体条件');
      node(info,'p',entry.ingredients.join('／'));node(info,'p',`${entry.nature}・${entry.subskills.length?entry.subskills.join('／'):'サブスキル補正なし'}・スキルLv.${entry.skillLevel}`);
      node(tr,'td',window.PS_NUMBERS.display(entry.value));
     }
     if(!table.rows.length)node(results,'p','計算対応の候補はありません。');
     if(table.pending.length){const pending=details(results,`未算定 ${table.pending.length}件`);for(const row of table.pending)node(pending,'p',typeof row==='string'?row:row.name+(row.reason?'：'+row.reason:''))}
     const conditions=details(results,'比較条件');
     for(const note of data.notes)node(conditions,'p',note);
     node(conditions,'p','理想値は同じ個体条件で最大値、中央値は性格25通りと重複なしのサブスキル3種を等重みで比較した下側50％分位です。無補正は性格・サブスキルの補正なし。キャンチケは上部の切替を反映します。');
    }
    select.onchange=render;render();
   }catch(e){if(tokens.get(pageId)!==token)return;host.replaceChildren();node(host,'p',e.message);const retry=node(host,'button','再読み込み');retry.type='button';retry.className='btn';retry.onclick=window.PS_PAGE_RENDERERS[pageId]}
  };
 }
 function refresh(){for(const id of Object.keys(pages))if(document.getElementById(id).classList.contains('active'))window.PS_PAGE_RENDERERS[id]()}
 window.addEventListener('psg-camp-change',refresh);window.addEventListener('psg-ranking-basis-change',refresh);
})();
</script>
